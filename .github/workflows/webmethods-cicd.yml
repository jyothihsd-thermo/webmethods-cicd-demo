- name: Prepare WebMethods Checkout Directory
  shell: powershell
  run: |

    $source = $env:GITHUB_WORKSPACE
    $destination = $env:CHECKOUT_DIR

    Write-Host "============================================"
    Write-Host "Preparing WebMethods Checkout Directory"
    Write-Host "============================================"

    Write-Host "Source      : $source"
    Write-Host "Destination : $destination"

    # Create destination if it does not exist
    if (-not (Test-Path $destination)) {

        Write-Host "Creating checkout directory..."

        New-Item `
          -ItemType Directory `
          -Path $destination `
          -Force | Out-Null
    }

    # Remove previous checkout contents
    Write-Host "Cleaning previous checkout..."

    Get-ChildItem `
      -Path $destination `
      -Force |
      Remove-Item `
        -Recurse `
        -Force `
        -ErrorAction Stop

    # Copy repository contents
    Write-Host "Copying GitHub repository..."

    Get-ChildItem `
      -Path $source `
      -Force |
      Where-Object {
          $_.Name -ne ".git"
      } |
      Copy-Item `
        -Destination $destination `
        -Recurse `
        -Force `
        -ErrorAction Stop

    Write-Host ""
    Write-Host "============================================"
    Write-Host "Checkout copy completed successfully"
    Write-Host "============================================"

    Write-Host ""
    Write-Host "Contents of WebMethods checkout directory:"

    Get-ChildItem `
      -Path $destination `
      -Force
