name: WebMethods CI/CD

on:

  # =========================================================
  # Manual execution
  # =========================================================

  workflow_dispatch:

    inputs:

      targetEnvironment:
        description: "Target Environment"
        required: true
        type: string
        default: "DEV"

      packageName:
        description: "WebMethods Package Name"
        required: true
        type: string
        default: "ThermoDemoPackage1"

      targetISGroupAlias:
        description: "Target IS Group Alias"
        required: true
        type: string
        default: "default"

      buildNumber:
        description: "Build Number"
        required: false
        type: string
        default: ""

      hasAdapterPackage:
        description: "Has Adapter Configuration Package"
        required: true
        type: boolean
        default: false

      adapterConfigPackage:
        description: "Adapter Configuration Package"
        required: false
        type: string
        default: ""

      RepoBranchName:
        description: "Repository Branch Name"
        required: true
        type: string
        default: "main"

      executeWmTestSuite:
        description: "Execute WebMethods Integration Test Suite"
        required: true
        type: boolean
        default: false


  # =========================================================
  # Automatic execution on main
  # =========================================================

  push:
    branches:
      - main


jobs:

  webmethods-cicd:

    name: WebMethods CI/CD

    # =======================================================
    # Self-hosted Windows WebMethods runner
    # =======================================================

    runs-on: [self-hosted, windows, webmethods]


    # =======================================================
    # Environment
    # =======================================================

    env:

      # -------------------------------------------------------
      # GitHub / Jenkins parameter equivalents
      # -------------------------------------------------------

      PACKAGE_NAME: ${{ inputs.packageName || 'ThermoDemoPackage1' }}

      TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment || 'DEV' }}

      TARGET_ISGROUP_ALIAS: ${{ inputs.targetISGroupAlias || 'default' }}

      MAIN_BUILDNUMBER: ${{ inputs.buildNumber || github.run_number }}

      HAS_ADAPTERPKG: ${{ inputs.hasAdapterPackage || false }}

      ADAPTER_CONFIGPKG: ${{ inputs.adapterConfigPackage || '' }}

      REPO_BRANCH_NAME: ${{ inputs.RepoBranchName || github.ref_name }}

      EXECUTE_WMTEST: ${{ inputs.executeWmTestSuite || false }}


      # -------------------------------------------------------
      # Java
      # -------------------------------------------------------

      JAVA_HOME: 'C:\SoftwareAG11\jvm\jvm'


      # -------------------------------------------------------
      # Ant
      # -------------------------------------------------------

      ANT_HOME: 'C:\SoftwareAG11_ABE\common\lib\ant'


      # -------------------------------------------------------
      # ABE
      # -------------------------------------------------------

      ABE_HOME: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment'

      ABE_BUILD: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment\bin\build.bat'

      ABE_MASTER_BUILD: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment\master_build\build.xml'


      # -------------------------------------------------------
      # WebMethods checkout
      # -------------------------------------------------------

      CHECKOUT_DIR: 'C:\SoftwareAG\tools\Checkout'


      # -------------------------------------------------------
      # ABE deployment repository/output
      #
      # This is the directory configured in
      # ProjectAutomator.xml
      # -------------------------------------------------------

      BUILD_OUTPUT_DIR: 'C:\SoftwareAG\tools\Build'


      # -------------------------------------------------------
      # Expected ABE artifact
      # -------------------------------------------------------

      ABE_IS_OUTPUT_DIR: 'C:\SoftwareAG\tools\Build\IS'

      ABE_COMPOSITE: 'C:\SoftwareAG\tools\Build\IS\cicdDemo.zip'


      # -------------------------------------------------------
      # ISCCR
      # -------------------------------------------------------

      ISCCR_HOME: 'C:\SoftwareAG\tools\CodeReview\ISCCR'

      ISCCR_CMD: 'C:\SoftwareAG\tools\CodeReview\ISCCR\CodeReview.cmd'

      ISCCR_LOG: 'C:\isccr\ISCCR.log'


      # -------------------------------------------------------
      # Project Automator
      # -------------------------------------------------------

      PROJECT_AUTOMATOR: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\projectAutomator.bat'

      PROJECT_AUTOMATOR_XML: 'C:\SoftwareAG\tools\Deploy\ProjectAutomator.xml'


      # -------------------------------------------------------
      # Deployer
      #
      # Deployer Server:
      #   localhost:5558
      #
      # Target Integration Server:
      #   localhost:5551
      # -------------------------------------------------------

      DEPLOYER_HOME: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin'

      DEPLOYER_CMD: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\Deployer.bat'

      DEPLOYER_HOST: 'localhost'

      DEPLOYER_PORT: '5558'

      DEPLOYER_USER: 'Administrator'

      # POC value as requested
      DEPLOYER_PASSWORD: 'manage'


      # -------------------------------------------------------
      # Target Integration Server
      # -------------------------------------------------------

      TARGET_IS_HOST: 'localhost'

      TARGET_IS_PORT: '5551'


      # -------------------------------------------------------
      # Deployer Project
      #
      # This is the actual project name currently created
      # by your ProjectAutomator.xml because of projectPrefix.
      # -------------------------------------------------------

      DEPLOYMENT_PROJECT: 'MyFirstCICD_Deploy1MyFirstCICD_Deploy1'

      DEPLOYMENT_CONTROL: 'myDeployment'


      # -------------------------------------------------------
      # Deployment project source
      # -------------------------------------------------------

      DEPLOYMENT_SOURCE_DIR: 'C:\SoftwareAG\tools\Build'


    steps:


      # =======================================================
      # 1. Checkout GitHub repository
      # =======================================================

      - name: Checkout GitHub Repository

        uses: actions/checkout@v4

        with:
          clean: true


      # =======================================================
      # 2. Display build information
      # =======================================================

      - name: Display Build Information

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "WEBMETHODS CI/CD"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Repository          : $env:GITHUB_REPOSITORY"
          Write-Host "Branch              : $env:GITHUB_REF_NAME"
          Write-Host "Commit              : $env:GITHUB_SHA"
          Write-Host "Run Number          : $env:GITHUB_RUN_NUMBER"
          Write-Host "Workflow            : $env:GITHUB_WORKFLOW"

          Write-Host ""
          Write-Host "Runner              : $env:RUNNER_NAME"
          Write-Host "Computer            : $env:COMPUTERNAME"

          Write-Host ""
          Write-Host "Package             : $env:PACKAGE_NAME"
          Write-Host "Target Environment  : $env:TARGET_ENVIRONMENT"
          Write-Host "Target IS Group     : $env:TARGET_ISGROUP_ALIAS"
          Write-Host "Build Number        : $env:MAIN_BUILDNUMBER"
          Write-Host "Repository Branch   : $env:REPO_BRANCH_NAME"

          Write-Host ""
          Write-Host "Checkout Directory  : $env:CHECKOUT_DIR"
          Write-Host "Build Output        : $env:BUILD_OUTPUT_DIR"

          Write-Host ""
          Write-Host "Java                : $env:JAVA_HOME"
          Write-Host "Ant                 : $env:ANT_HOME"
          Write-Host "ABE                 : $env:ABE_HOME"
          Write-Host "ABE Master Build    : $env:ABE_MASTER_BUILD"

          Write-Host ""
          Write-Host "ISCCR               : $env:ISCCR_CMD"

          Write-Host ""
          Write-Host "Project Automator   : $env:PROJECT_AUTOMATOR"
          Write-Host "Project XML         : $env:PROJECT_AUTOMATOR_XML"

          Write-Host ""
          Write-Host "Deployer Server     : $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
          Write-Host "Target IS           : $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"

          Write-Host ""
          Write-Host "Deployer Project    : $env:DEPLOYMENT_PROJECT"
          Write-Host "Deployment Candidate: $env:DEPLOYMENT_CONTROL"


      # =======================================================
      # 3. Validate Java
      # =======================================================

      - name: Validate Java

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "JAVA VALIDATION"
          Write-Host "============================================"

          $javaExe = Join-Path $env:JAVA_HOME "bin\java.exe"

          if (-not (Test-Path -LiteralPath $javaExe)) {

              Write-Error "Java executable not found:"
              Write-Error $javaExe

              exit 1
          }

          Write-Host "JAVA_HOME:"
          Write-Host $env:JAVA_HOME

          Write-Host ""
          Write-Host "Java version:"

          & $javaExe -version

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Java validation failed."

              exit $LASTEXITCODE
          }


      # =======================================================
      # 4. Validate WebMethods tooling
      # =======================================================

      - name: Validate WebMethods Tooling

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "WEBMETHODS TOOLING VALIDATION"
          Write-Host "============================================"

          $paths = @(
            $env:ABE_BUILD,
            $env:ABE_MASTER_BUILD,
            "$env:ANT_HOME\bin\ant.bat",
            $env:ISCCR_CMD,
            $env:PROJECT_AUTOMATOR,
            $env:PROJECT_AUTOMATOR_XML,
            $env:DEPLOYER_CMD
          )

          foreach ($path in $paths) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $path

              if (-not (Test-Path -LiteralPath $path)) {

                  Write-Error "Required file not found:"
                  Write-Error $path

                  exit 1
              }
          }

          Write-Host ""
          Write-Host "All required WebMethods tools found."


      # =======================================================
      # 5. Prepare WebMethods Checkout Directory
      # =======================================================

      - name: Prepare WebMethods Checkout Directory

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "PREPARE WEBMETHODS CHECKOUT"
          Write-Host "============================================"

          $source = $env:GITHUB_WORKSPACE
          $destination = $env:CHECKOUT_DIR

          Write-Host "Source:"
          Write-Host $source

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $destination


          if (-not (Test-Path -LiteralPath $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null
          }


          Write-Host ""
          Write-Host "Cleaning previous checkout..."


          Get-ChildItem `
            -LiteralPath $destination `
            -Force |
            Remove-Item `
              -Recurse `
              -Force `
              -ErrorAction Stop


          Write-Host ""
          Write-Host "Copying GitHub repository..."


          Get-ChildItem `
            -LiteralPath $source `
            -Force |
            Where-Object {
              $_.Name -ne ".git"
            } |
            Copy-Item `
              -Destination $destination `
              -Recurse `
              -Force `
              -ErrorAction Stop


          Write-Host ""
          Write-Host "WebMethods checkout prepared successfully."


      # =======================================================
      # 6. Verify package
      # =======================================================

      - name: Verify WebMethods Package

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "PACKAGE VALIDATION"
          Write-Host "============================================"

          $packagePath = Join-Path `
            $env:CHECKOUT_DIR `
            $env:PACKAGE_NAME


          Write-Host "Package:"
          Write-Host $env:PACKAGE_NAME

          Write-Host ""
          Write-Host "Package Path:"
          Write-Host $packagePath


          if (-not (Test-Path -LiteralPath $packagePath)) {

              Write-Error "WebMethods package not found."

              Write-Host ""
              Write-Host "Available packages:"

              Get-ChildItem `
                -LiteralPath $env:CHECKOUT_DIR `
                -Directory

              exit 1
          }


          Write-Host ""
          Write-Host "Package found successfully."


      # =======================================================
      # 7. ISCCR
      #
      # Non-blocking by design.
      # =======================================================

      - name: ISCCR Code Review

        shell: cmd

        continue-on-error: true

        run: |

          echo ============================================
          echo ISCCR STATIC CODE REVIEW
          echo ============================================

          echo.
          echo JAVA_HOME:
          echo %JAVA_HOME%

          echo.
          echo ISCCR:
          echo %ISCCR_CMD%

          echo.
          echo Package:
          echo %PACKAGE_NAME%

          echo.
          echo Package Directory:
          echo %CHECKOUT_DIR%\%PACKAGE_NAME%

          echo.

          if not exist "%CHECKOUT_DIR%\%PACKAGE_NAME%" (
              echo ERROR: Package directory not found.
              exit /b 1
          )


          call "%ISCCR_CMD%" ^
            -Dcode.review.pkgname=%PACKAGE_NAME% ^
            -Dcode.review.pkgprefix=Thermo ^
            -Dcode.review.folder-prefix=Thermo ^
            -Dcode.review.directory="%CHECKOUT_DIR%\%PACKAGE_NAME%"


          echo.
          echo ISCCR Exit Code: %ERRORLEVEL%

          echo.
          echo ISCCR completed.
          echo ISCCR failures are configured as non-blocking.


      # =======================================================
      # 8. Evaluate ISCCR result
      # =======================================================

      - name: Evaluate ISCCR Result

        if: always()

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "ISCCR RESULT"
          Write-Host "============================================"


          if (-not (Test-Path -LiteralPath $env:ISCCR_LOG)) {

              Write-Warning "ISCCR log not found."

              exit 0
          }


          $logContent = Get-Content `
            -LiteralPath $env:ISCCR_LOG `
            -Raw


          $pattern = 'CODE REVIEW STATUS - (PASS|WARNING|FAILED)'

          $match = [regex]::Match(
            $logContent,
            $pattern
          )


          if (-not $match.Success) {

              Write-Warning "CODE REVIEW STATUS not found."

              exit 0
          }


          $status = $match.Groups[1].Value

          Write-Host "ISCCR Status: $status"


          if ($status -eq "FAILED") {

              Write-Warning "ISCCR FAILED."
              Write-Warning "Pipeline continues by design."
          }

          elseif ($status -eq "WARNING") {

              Write-Warning "ISCCR completed with WARNINGS."
          }

          elseif ($status -eq "PASS") {

              Write-Host "ISCCR PASSED."
          }


      # =======================================================
      # 9. Prepare ABE output
      # =======================================================

      - name: Prepare ABE Output Directory

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "PREPARE ABE OUTPUT"
          Write-Host "============================================"


          if (-not (Test-Path -LiteralPath $env:BUILD_OUTPUT_DIR)) {

              New-Item `
                -ItemType Directory `
                -Path $env:BUILD_OUTPUT_DIR `
                -Force | Out-Null
          }


          Write-Host ""
          Write-Host "ABE output directory:"
          Write-Host $env:BUILD_OUTPUT_DIR


      # =======================================================
      # 10. ABE Build
      # =======================================================

      - name: ABE Build

        shell: cmd

        run: |

          echo ============================================
          echo ABE BUILD
          echo ============================================

          echo.
          echo ABE_HOME:
          echo %ABE_HOME%

          echo.
          echo ABE_MASTER_BUILD:
          echo %ABE_MASTER_BUILD%

          echo.
          echo ANT_HOME:
          echo %ANT_HOME%

          echo.
          echo CHECKOUT_DIR:
          echo %CHECKOUT_DIR%

          echo.
          echo BUILD_OUTPUT_DIR:
          echo %BUILD_OUTPUT_DIR%

          echo.
          echo PACKAGE:
          echo %PACKAGE_NAME%

          echo.
          echo TARGET_ENVIRONMENT:
          echo %TARGET_ENVIRONMENT%

          echo.
          echo TARGET_ISGROUP_ALIAS:
          echo %TARGET_ISGROUP_ALIAS%

          echo.
          echo BUILD_NUMBER:
          echo %MAIN_BUILDNUMBER%


          if not exist "%ANT_HOME%\bin\ant.bat" (
              echo ERROR: Ant executable not found.
              exit /b 1
          )


          if not exist "%ABE_MASTER_BUILD%" (
              echo ERROR: ABE master build.xml not found.
              exit /b 1
          )


          echo.
          echo Starting ABE master build...


          call "%ANT_HOME%\bin\ant.bat" ^
            -DtargetISGroupAlias="%TARGET_ISGROUP_ALIAS%" ^
            -DCHECKOUT_DIR="%CHECKOUT_DIR%" ^
            -DtargetEnv="%TARGET_ENVIRONMENT%" ^
            -DSAGHome="C:\SoftwareAG11_ABE" ^
            -DprojectName="%PACKAGE_NAME%_%MAIN_BUILDNUMBER%" ^
            -f "%ABE_MASTER_BUILD%" ^
            build


          set "ABE_EXIT_CODE=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo ABE EXIT CODE: %ABE_EXIT_CODE%
          echo ============================================


          if not "%ABE_EXIT_CODE%"=="0" (

              echo ERROR: ABE Build FAILED.

              exit /b %ABE_EXIT_CODE%
          )


          echo.
          echo ABE Build completed successfully.


      # =======================================================
      # 11. Verify ABE output
      # =======================================================

      - name: Verify ABE Deployment Artifact

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "VERIFY ABE DEPLOYMENT ARTIFACT"
          Write-Host "============================================"


          Write-Host "Build Output Directory:"
          Write-Host $env:BUILD_OUTPUT_DIR

          Write-Host ""
          Write-Host "Expected Composite:"
          Write-Host $env:ABE_COMPOSITE


          if (-not (Test-Path -LiteralPath $env:ABE_IS_OUTPUT_DIR)) {

              Write-Error "ABE IS output directory does not exist."

              exit 1
          }


          if (-not (Test-Path -LiteralPath $env:ABE_COMPOSITE)) {

              Write-Error "Expected deployment composite was not found."

              Write-Host ""
              Write-Host "Available IS artifacts:"

              Get-ChildItem `
                -LiteralPath $env:ABE_IS_OUTPUT_DIR `
                -Force

              exit 1
          }


          Write-Host ""
          Write-Host "cicdDemo.zip found successfully."


          Write-Host ""
          Write-Host "ABE deployment artifacts:"

          Get-ChildItem `
            -LiteralPath $env:ABE_IS_OUTPUT_DIR `
            -File `
            -Force


      # =======================================================
      # 12. Validate dependency configuration
      #
      # IMPORTANT:
      # ProjectAutomator.xml should use:
      #
      # ignoreMissingDependencies="false"
      #
      # so missing dependencies become deployment-blocking.
      # =======================================================

      - name: Validate Dependency Configuration

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "DEPENDENCY CONFIGURATION"
          Write-Host "============================================"


          if (-not (Test-Path -LiteralPath $env:PROJECT_AUTOMATOR_XML)) {

              Write-Error "ProjectAutomator.xml not found."

              exit 1
          }


          [xml]$xml = Get-Content `
            -LiteralPath $env:PROJECT_AUTOMATOR_XML


          $project = $xml.DeployerSpec.Projects.Project


          if ($null -eq $project) {

              Write-Error "Unable to locate Project definition."

              exit 1
          }


          Write-Host "Project:"
          Write-Host $project.name

          Write-Host ""
          Write-Host "ignoreMissingDependencies:"
          Write-Host $project.ignoreMissingDependencies


          if ($project.ignoreMissingDependencies -ne "false") {

              Write-Error "WARNING: ignoreMissingDependencies is not false."

              Write-Error "Missing dependencies may not block deployment."

              Write-Error "Set this in ProjectAutomator.xml:"

              Write-Error 'ignoreMissingDependencies="false"'

              exit 1
          }


          Write-Host ""
          Write-Host "Dependency validation is configured as blocking."


      # =======================================================
      # 13. Validate Project Automator files
      # =======================================================

      - name: Validate Project Automator

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "PROJECT AUTOMATOR VALIDATION"
          Write-Host "============================================"


          if (-not (Test-Path -LiteralPath $env:PROJECT_AUTOMATOR)) {

              Write-Error "ProjectAutomator.bat not found."

              exit 1
          }


          if (-not (Test-Path -LiteralPath $env:PROJECT_AUTOMATOR_XML)) {

              Write-Error "ProjectAutomator.xml not found."

              exit 1
          }


          Write-Host "ProjectAutomator.bat : FOUND"
          Write-Host "ProjectAutomator.xml : FOUND"


      # =======================================================
      # 14. Validate connectivity
      # =======================================================

      - name: Validate Deployment Connectivity

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "DEPLOYMENT CONNECTIVITY"
          Write-Host "============================================"


          Write-Host ""
          Write-Host "Deployer Server:"
          Write-Host "$env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"


          Write-Host ""
          Write-Host "Target Integration Server:"
          Write-Host "$env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"


          Write-Host ""
          Write-Host "Testing Deployer Server..."


          $deployer = Test-NetConnection `
            -ComputerName $env:DEPLOYER_HOST `
            -Port ([int]$env:DEPLOYER_PORT) `
            -WarningAction SilentlyContinue


          if (-not $deployer.TcpTestSucceeded) {

              Write-Error "Deployer Server is not reachable."

              exit 1
          }


          Write-Host "Deployer Server: CONNECTED"


          Write-Host ""
          Write-Host "Testing Target Integration Server..."


          $target = Test-NetConnection `
            -ComputerName $env:TARGET_IS_HOST `
            -Port ([int]$env:TARGET_IS_PORT) `
            -WarningAction SilentlyContinue


          if (-not $target.TcpTestSucceeded) {

              Write-Error "Target Integration Server is not reachable."

              exit 1
          }


          Write-Host "Target Integration Server: CONNECTED"


      # =======================================================
      # 15. Create / recreate deployment project
      # =======================================================

      - name: Create Deployment Project

        shell: cmd

        run: |

          echo ============================================
          echo CREATE DEPLOYMENT PROJECT
          echo ============================================

          echo.
          echo Project Automator:
          echo %PROJECT_AUTOMATOR%

          echo.
          echo Project XML:
          echo %PROJECT_AUTOMATOR_XML%

          echo.
          echo Deployer:
          echo %DEPLOYER_HOST%:%DEPLOYER_PORT%

          echo.
          echo Target IS:
          echo %TARGET_IS_HOST%:%TARGET_IS_PORT%

          echo.
          echo Project:
          echo %DEPLOYMENT_PROJECT%

          echo.
          echo Candidate:
          echo %DEPLOYMENT_CONTROL%

          echo.
          echo Source Repository:
          echo %DEPLOYMENT_SOURCE_DIR%

          echo.
          echo Running Project Automator...


          call "%PROJECT_AUTOMATOR%" "%PROJECT_AUTOMATOR_XML%" ^
            > "%RUNNER_TEMP%\project_automator.log" 2>&1


          set "PA_EXIT_CODE=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo PROJECT AUTOMATOR OUTPUT
          echo ============================================

          type "%RUNNER_TEMP%\project_automator.log"


          echo.
          echo Project Automator Exit Code:
          echo %PA_EXIT_CODE%


          if not "%PA_EXIT_CODE%"=="0" (

              echo.
              echo ERROR: Project Automator failed.

              exit /b %PA_EXIT_CODE%
          )


          echo.
          echo Project Automator completed successfully.


      # =======================================================
      # 16. Verify project exists
      # =======================================================

      - name: Verify Deployment Project

        shell: cmd

        run: |

          echo ============================================
          echo VERIFY DEPLOYMENT PROJECT
          echo ============================================

          echo.
          echo Project:
          echo %DEPLOYMENT_PROJECT%

          echo.
          echo Listing projects...


          call "%DEPLOYER_CMD%" ^
            --list ^
            -candidate project ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            > "%RUNNER_TEMP%\deployer_projects.txt" 2>&1


          set "LIST_PROJECT_EXIT=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo DEPLOYER PROJECT LIST
          echo ============================================

          type "%RUNNER_TEMP%\deployer_projects.txt"


          echo.
          echo Exit Code:
          echo %LIST_PROJECT_EXIT%


          if not "%LIST_PROJECT_EXIT%"=="0" (

              echo ERROR: Unable to list Deployer projects.

              exit /b %LIST_PROJECT_EXIT%
          )


          "%SystemRoot%\System32\findstr.exe" /I /C:"%DEPLOYMENT_PROJECT%" "%RUNNER_TEMP%\deployer_projects.txt" >nul


          if errorlevel 1 (

              echo.
              echo ERROR: Project "%DEPLOYMENT_PROJECT%" does not exist.

              exit /b 1
          )


          echo.
          echo Project "%DEPLOYMENT_PROJECT%" exists.


      # =======================================================
      # 17. Verify deployment candidate
      # =======================================================

      - name: Verify Deployment Candidate

        shell: cmd

        run: |

          echo ============================================
          echo VERIFY DEPLOYMENT CANDIDATE
          echo ============================================

          echo.
          echo Project:
          echo %DEPLOYMENT_PROJECT%

          echo.
          echo Candidate:
          echo %DEPLOYMENT_CONTROL%

          echo.
          echo Listing deployment candidates...


          call "%DEPLOYER_CMD%" ^
            --list ^
            -candidate dc ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            > "%RUNNER_TEMP%\deployment_candidates.txt" 2>&1


          set "LIST_DC_EXIT=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo DEPLOYMENT CANDIDATES
          echo ============================================

          type "%RUNNER_TEMP%\deployment_candidates.txt"


          echo.
          echo Exit Code:
          echo %LIST_DC_EXIT%


          if not "%LIST_DC_EXIT%"=="0" (

              echo ERROR: Unable to list deployment candidates.

              exit /b %LIST_DC_EXIT%
          )


          "%SystemRoot%\System32\findstr.exe" /I /C:"%DEPLOYMENT_CONTROL%" "%RUNNER_TEMP%\deployment_candidates.txt" >nul


          if errorlevel 1 (

              echo.
              echo ERROR: Deployment candidate "%DEPLOYMENT_CONTROL%" was not found.

              exit /b 1
          )


          echo.
          echo Deployment candidate "%DEPLOYMENT_CONTROL%" exists.


      # =======================================================
      # 18. Simulate deployment
      #
      # This is the CI dependency / validation gate.
      #
      # With ignoreMissingDependencies=false in the XML,
      # missing dependencies should prevent continuation.
      # =======================================================

      - name: Simulate Deployment and Validate Dependencies

        shell: cmd

        run: |

          echo ============================================
          echo DEPLOYMENT SIMULATION
          echo ============================================

          echo.
          echo Project:
          echo %DEPLOYMENT_PROJECT%

          echo.
          echo Candidate:
          echo %DEPLOYMENT_CONTROL%

          echo.
          echo Deployer Server:
          echo %DEPLOYER_HOST%:%DEPLOYER_PORT%

          echo.
          echo Target Integration Server:
          echo %TARGET_IS_HOST%:%TARGET_IS_PORT%

          echo.
          echo Running Deployer simulation...


          call "%DEPLOYER_CMD%" ^
            --simulate ^
            -dc "%DEPLOYMENT_CONTROL%" ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            -reportFilePath "%RUNNER_TEMP%\deployment-simulation-report.xml"


          set "SIMULATE_EXIT_CODE=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo SIMULATION EXIT CODE: %SIMULATE_EXIT_CODE%
          echo ============================================


          if not "%SIMULATE_EXIT_CODE%"=="0" (

              echo.
              echo ============================================
              echo DEPLOYMENT SIMULATION FAILED
              echo ============================================

              echo Possible causes:
              echo - Missing asset dependency
              echo - Unresolved dependency
              echo - Invalid deployment map
              echo - Invalid target configuration
              echo - Invalid deployment candidate

              exit /b %SIMULATE_EXIT_CODE%
          )


          echo.
          echo ============================================
          echo DEPLOYMENT SIMULATION PASSED
          echo ============================================

          echo Deployment can proceed.


      # =======================================================
      # 19. Actual deployment
      # =======================================================

      - name: Deploy to Target Integration Server

        shell: cmd

        run: |

          echo ============================================
          echo WEBMETHODS DEPLOYMENT
          echo ============================================

          echo.
          echo Deployer Server:
          echo %DEPLOYER_HOST%:%DEPLOYER_PORT%

          echo.
          echo Target Integration Server:
          echo %TARGET_IS_HOST%:%TARGET_IS_PORT%

          echo.
          echo Project:
          echo %DEPLOYMENT_PROJECT%

          echo.
          echo Deployment Candidate:
          echo %DEPLOYMENT_CONTROL%

          echo.
          echo Starting deployment...


          if "%DEPLOYER_PASSWORD%"=="" (

              echo ERROR: Deployer password is empty.

              exit /b 1
          )


          call "%DEPLOYER_CMD%" ^
            --deploy ^
            -dc "%DEPLOYMENT_CONTROL%" ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            -force


          set "DEPLOYER_EXIT_CODE=%ERRORLEVEL%"


          echo.
          echo ============================================
          echo DEPLOYER EXIT CODE: %DEPLOYER_EXIT_CODE%
          echo ============================================


          if not "%DEPLOYER_EXIT_CODE%"=="0" (

              echo.
              echo ERROR: WebMethods deployment failed.

              exit /b %DEPLOYER_EXIT_CODE%
          )


          echo.
          echo ============================================
          echo DEPLOYMENT SUCCESSFUL
          echo ============================================


      # =======================================================
      # 20. Verify target IS
      # =======================================================

      - name: Verify Target Integration Server

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "VERIFY TARGET INTEGRATION SERVER"
          Write-Host "============================================"


          Write-Host "Target:"
          Write-Host "$env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"


          $result = Test-NetConnection `
            -ComputerName $env:TARGET_IS_HOST `
            -Port ([int]$env:TARGET_IS_PORT) `
            -WarningAction SilentlyContinue


          if (-not $result.TcpTestSucceeded) {

              Write-Error "Target Integration Server is not reachable after deployment."

              exit 1
          }


          Write-Host ""
          Write-Host "Target Integration Server is reachable."


      # =======================================================
      # 21. Adapter configuration
      # =======================================================

      - name: Deploy Adapter Configuration

        if: env.HAS_ADAPTERPKG == 'true'

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "ADAPTER CONFIGURATION"
          Write-Host "============================================"

          Write-Host "Target IS Group:"
          Write-Host $env:TARGET_ISGROUP_ALIAS

          Write-Host ""
          Write-Host "Adapter Package:"
          Write-Host $env:ADAPTER_CONFIGPKG

          Write-Host ""
          Write-Host "Repository Branch:"
          Write-Host $env:REPO_BRANCH_NAME


          Write-Warning "Original Jenkins pipeline invokes a separate"
          Write-Warning "adapter configuration Jenkins job."

          Write-Warning "That downstream job still needs to be migrated"
          Write-Warning "to GitHub Actions."


      # =======================================================
      # 22. WebMethods Integration Test Suite
      # =======================================================

      - name: Integration Test Suite

        if: env.EXECUTE_WMTEST == 'true'

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "WEBMETHODS INTEGRATION TEST SUITE"
          Write-Host "============================================"

          Write-Host "Checkout Directory:"
          Write-Host $env:CHECKOUT_DIR

          Write-Warning "The original Jenkins wmtestsuite buildTest.xml"
          Write-Warning "path has not been confirmed on this runner."

          Write-Warning "This stage is currently informational."


      # =======================================================
      # 23. Upload Integration Test Results
      # =======================================================

      - name: Upload Integration Test Results

        if: always() && env.EXECUTE_WMTEST == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: integration-test-results-${{ github.run_number }}

          path: |
            *.xml
            **/*.xml

          if-no-files-found: warn


      # =======================================================
      # 24. Postman
      # =======================================================

      - name: Postman Unit Tests

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "POSTMAN UNIT TESTS"
          Write-Host "============================================"

          Write-Host "Postman stage."


      # =======================================================
      # 25. SonarScanner
      # =======================================================

      - name: SonarScanner Code Review

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "SONARSCANNER CODE REVIEW"
          Write-Host "============================================"

          Write-Host "SonarScanner stage."


      # =======================================================
      # 26. JMeter
      # =======================================================

      - name: JMeter Performance Test

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "JMETER PERFORMANCE TEST"
          Write-Host "============================================"

          Write-Host "JMeter stage."


      # =======================================================
      # 27. SOAPUI
      # =======================================================

      - name: SOAPUI Tests

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "SOAPUI TESTS"
          Write-Host "============================================"

          Write-Host "SOAPUI stage."


      # =======================================================
      # 28. Send Reports
      # =======================================================

      - name: Send Reports

        if: always()

        shell: powershell

        run: |

          Write-Host "============================================"
          Write-Host "SEND REPORTS"
          Write-Host "============================================"

          Write-Host "sagdevops-cicd-sendreports"


      # =======================================================
      # 29. Final summary
      # =======================================================

      - name: Environment Summary

        if: always()

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "============================================"
          Write-Host "WEBMETHODS CI/CD SUMMARY"
          Write-Host "============================================"

          Write-Host ""
          Write-Host "Runner              : $env:RUNNER_NAME"
          Write-Host "Computer            : $env:COMPUTERNAME"

          Write-Host ""
          Write-Host "Repository          : $env:GITHUB_REPOSITORY"
          Write-Host "Branch              : $env:GITHUB_REF_NAME"
          Write-Host "Commit              : $env:GITHUB_SHA"

          Write-Host ""
          Write-Host "Package             : $env:PACKAGE_NAME"
          Write-Host "Target Environment  : $env:TARGET_ENVIRONMENT"
          Write-Host "Target IS Group     : $env:TARGET_ISGROUP_ALIAS"
          Write-Host "Build Number        : $env:MAIN_BUILDNUMBER"

          Write-Host ""
          Write-Host "Checkout            : $env:CHECKOUT_DIR"
          Write-Host "Build Output        : $env:BUILD_OUTPUT_DIR"
          Write-Host "ABE Composite       : $env:ABE_COMPOSITE"

          Write-Host ""
          Write-Host "Java                : $env:JAVA_HOME"
          Write-Host "ABE                 : $env:ABE_HOME"
          Write-Host "ABE Master Build    : $env:ABE_MASTER_BUILD"

          Write-Host ""
          Write-Host "ISCCR               : $env:ISCCR_HOME"

          Write-Host ""
          Write-Host "Project Automator   : $env:PROJECT_AUTOMATOR"
          Write-Host "Project XML         : $env:PROJECT_AUTOMATOR_XML"

          Write-Host ""
          Write-Host "Deployer Server     : $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
          Write-Host "Target IS           : $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"

          Write-Host ""
          Write-Host "Deployment Project  : $env:DEPLOYMENT_PROJECT"
          Write-Host "Deployment Candidate: $env:DEPLOYMENT_CONTROL"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "PIPELINE FINISHED"
          Write-Host "============================================"
