name: WebMethods CI/CD

on:
  workflow_dispatch:
    inputs:
      targetEnvironment:
        description: "Target Environment"
        required: true
        type: string
        default: "DEV"
      packageName:
        description: "WebMethods Package Name"
        required: true
        type: string
        default: "ThermoDemo1"
      targetISGroupAlias:
        description: "Target IS Group Alias"
        required: true
        type: string
        default: "default"
      buildNumber:
        description: "Build Number"
        required: false
        type: string
        default: ""
      hasAdapterPackage:
        description: "Has Adapter Configuration Package"
        required: true
        type: boolean
        default: false
      adapterConfigPackage:
        description: "Adapter Configuration Package"
        required: false
        type: string
        default: ""
      RepoBranchName:
        description: "Repository Branch Name"
        required: true
        type: string
        default: "main"
      executeWmTestSuite:
        description: "Execute WebMethods Integration Test Suite"
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main

jobs:
  webmethods-cicd:
    name: WebMethods CI/CD
    runs-on: [self-hosted, windows, webmethods]

    env:
      # GitHub / Jenkins parameters
      PACKAGE_NAME: ${{ inputs.packageName || 'ThermoDemo1' }}
      TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment || 'DEV' }}
      TARGET_ISGROUP_ALIAS: ${{ inputs.targetISGroupAlias || 'default' }}
      MAIN_BUILDNUMBER: ${{ inputs.buildNumber || github.run_number }}
      HAS_ADAPTERPKG: ${{ inputs.hasAdapterPackage || false }}
      ADAPTER_CONFIGPKG: ${{ inputs.adapterConfigPackage || '' }}
      REPO_BRANCH_NAME: ${{ inputs.RepoBranchName || github.ref_name }}
      EXECUTE_WMTEST: ${{ inputs.executeWmTestSuite || false }}

      # Java
      JAVA_HOME: 'C:\SoftwareAG11\jvm\jvm'

      # Ant
      ANT_HOME: 'C:\SoftwareAG11_ABE\common\lib\ant'

      # ABE
      ABE_HOME: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment'
      ABE_BUILD: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment\bin\build.bat'
      ABE_MASTER_BUILD: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment\master_build\build.xml'

      # WebMethods checkout
      CHECKOUT_DIR: 'C:\SoftwareAG\tools\Checkout\is\packages'

      # ABE build output / Deployer repository
      BUILD_OUTPUT_DIR: 'C:\SoftwareAG\tools\Build'
      ABE_IS_OUTPUT_DIR: 'C:\SoftwareAG\tools\Build\IS'
      ABE_COMPOSITE: 'C:\SoftwareAG\tools\Build\IS\cicdDemo.zip'

      # ISCCR
      ISCCR_HOME: 'C:\SoftwareAG\tools\CodeReview\ISCCR'
      ISCCR_CMD: 'C:\SoftwareAG\tools\CodeReview\ISCCR\CodeReview.cmd'
      ISCCR_LOG: 'C:\isccr\ISCCR.log'

      # Project Automator
      PROJECT_AUTOMATOR: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\projectAutomator.bat'
      PROJECT_AUTOMATOR_XML: 'C:\SoftwareAG\tools\Deploy\ProjectAutomator.xml'

      # Deployer server
      DEPLOYER_HOME: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin'
      DEPLOYER_CMD: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\Deployer.bat'
      DEPLOYER_HOST: 'localhost'
      DEPLOYER_PORT: '5558'
      DEPLOYER_USER: 'Administrator'
      # POC only - replace with GitHub Secret later
      DEPLOYER_PASSWORD: 'manage'

      # Target Integration Server
      TARGET_IS_HOST: 'localhost'
      TARGET_IS_PORT: '5551'

      # Confirmed Deployer project/candidate names
      DEPLOYMENT_PROJECT: 'MyFirstCICD_Deploy1MyFirstCICD_Deploy1'
      DEPLOYMENT_CONTROL: 'myDeployment'

      # ProjectAutomator.xml source repository
      DEPLOYMENT_SOURCE_DIR: 'C:\SoftwareAG\tools\Build'

      # Reports
      REPORT_DIR: 'C:\SoftwareAG\tools\Report'

    steps:
      # =====================================================
      # 1. Checkout repository
      # =====================================================
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          clean: true

      # =====================================================
      # 2. Build information
      # =====================================================
      - name: Display Build Information
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "WEBMETHODS CI/CD"
          Write-Host "============================================"
          Write-Host "Repository          : $env:GITHUB_REPOSITORY"
          Write-Host "Branch              : $env:GITHUB_REF_NAME"
          Write-Host "Commit              : $env:GITHUB_SHA"
          Write-Host "Run Number          : $env:GITHUB_RUN_NUMBER"
          Write-Host "Runner              : $env:RUNNER_NAME"
          Write-Host "Computer            : $env:COMPUTERNAME"
          Write-Host "Package             : $env:PACKAGE_NAME"
          Write-Host "Target Environment  : $env:TARGET_ENVIRONMENT"
          Write-Host "Target IS Group     : $env:TARGET_ISGROUP_ALIAS"
          Write-Host "Build Number        : $env:MAIN_BUILDNUMBER"
          Write-Host "Checkout Directory  : $env:CHECKOUT_DIR"
          Write-Host "Build Output        : $env:BUILD_OUTPUT_DIR"
          Write-Host "Report Directory    : $env:REPORT_DIR"
          Write-Host "Java                : $env:JAVA_HOME"
          Write-Host "ABE                 : $env:ABE_HOME"
          Write-Host "ABE Master Build    : $env:ABE_MASTER_BUILD"
          Write-Host "ISCCR               : $env:ISCCR_CMD"
          Write-Host "Project Automator   : $env:PROJECT_AUTOMATOR"
          Write-Host "Project XML         : $env:PROJECT_AUTOMATOR_XML"
          Write-Host "Deployer Server     : $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
          Write-Host "Target IS           : $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"
          Write-Host "Deployer Project    : $env:DEPLOYMENT_PROJECT"
          Write-Host "Deployment Candidate: $env:DEPLOYMENT_CONTROL"
      # =====================================================
      # 3. Java validation
      # =====================================================
      - name: Validate Java
        shell: powershell
        run: |
          $javaExe = Join-Path $env:JAVA_HOME 'bin\java.exe'
          if (-not (Test-Path -LiteralPath $javaExe)) {
            Write-Error "Java executable not found: $javaExe"
            exit 1
          }
          & $javaExe -version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Java validation failed."
            exit $LASTEXITCODE
          }
      # =====================================================
      # 4. WebMethods tooling validation
      # =====================================================
      - name: Validate WebMethods Tooling
        shell: powershell
        run: |
          $requiredFiles = @(
            $env:ABE_BUILD,
            $env:ABE_MASTER_BUILD,
            "$env:ANT_HOME\bin\ant.bat",
            $env:ISCCR_CMD,
            $env:PROJECT_AUTOMATOR,
            $env:PROJECT_AUTOMATOR_XML,
            $env:DEPLOYER_CMD
          )
          foreach ($path in $requiredFiles) {
            Write-Host "Checking: $path"
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Required file not found: $path"
              exit 1
            }
          }
          Write-Host "All required WebMethods tools found."
      # =====================================================
      # 5. Prepare checkout directory
      # =====================================================
      - name: Prepare WebMethods Checkout Directory
        shell: powershell
        run: |
          $source = $env:GITHUB_WORKSPACE
          $destination = $env:CHECKOUT_DIR
          if (-not (Test-Path -LiteralPath $destination)) {
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
          }
          Get-ChildItem -LiteralPath $destination -Force |
            Remove-Item -Recurse -Force -ErrorAction Stop
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -ne '.git' } |
            Copy-Item -Destination $destination -Recurse -Force -ErrorAction Stop
          Write-Host "Repository copied to $destination"
      # =====================================================
      # 6. Verify package
      # =====================================================
      - name: Verify WebMethods Package
        shell: powershell
        run: |
          $packagePath = Join-Path $env:CHECKOUT_DIR $env:PACKAGE_NAME
          if (-not (Test-Path -LiteralPath $packagePath)) {
            Write-Error "WebMethods package not found: $packagePath"
            exit 1
          }
          Write-Host "Package found: $packagePath"
      # =====================================================
      # 7. ISCCR - non-blocking
      # =====================================================
      - name: ISCCR Code Review
        shell: cmd
        continue-on-error: true
        run: |
          echo ============================================
          echo ISCCR STATIC CODE REVIEW
          echo ============================================
          if not exist "%CHECKOUT_DIR%\%PACKAGE_NAME%" (
              echo ERROR: Package directory not found.
              exit /b 1
          )
          call "%ISCCR_CMD%" ^
            -Dcode.review.pkgname=%PACKAGE_NAME% ^
            -Dcode.review.pkgprefix=Thermo ^
            -Dcode.review.folder-prefix=Thermo ^
            -Dcode.review.directory="%CHECKOUT_DIR%\%PACKAGE_NAME%"
          echo.
          echo ISCCR Exit Code: %ERRORLEVEL%
          echo ISCCR is non-blocking. Pipeline will continue.
      # =====================================================
      # 8. Evaluate ISCCR result
      # =====================================================
      - name: Evaluate ISCCR Result
        if: always()
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "ISCCR RESULT"
          Write-Host "============================================"
          if (-not (Test-Path -LiteralPath $env:ISCCR_LOG)) {
            Write-Warning "ISCCR log not found."
            exit 0
          }
          $logContent = Get-Content -LiteralPath $env:ISCCR_LOG -Raw
          $match = [regex]::Match($logContent, 'CODE REVIEW STATUS - (PASS|WARNING|FAILED)')
          if (-not $match.Success) {
            Write-Warning "CODE REVIEW STATUS not found."
            exit 0
          }
          $status = $match.Groups[1].Value
          Write-Host "ISCCR Status: $status"
          switch ($status) {
            'PASS'    { Write-Host 'ISCCR PASSED.' }
            'WARNING' { Write-Warning 'ISCCR completed with WARNINGS.' }
            'FAILED'  { Write-Warning 'ISCCR FAILED. Pipeline continues by design.' }
          }
      # =====================================================
      # 9. Prepare ABE output
      # =====================================================
      - name: Prepare ABE Output Directory
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:BUILD_OUTPUT_DIR)) {
            New-Item -ItemType Directory -Path $env:BUILD_OUTPUT_DIR -Force | Out-Null
          }
          Write-Host "ABE output directory: $env:BUILD_OUTPUT_DIR"
      # =====================================================
      # 10. ABE Build
      # =====================================================
      - name: ABE Build
        shell: cmd
        run: |
          echo ============================================
          echo ABE BUILD
          echo ============================================
          echo ABE_HOME=%ABE_HOME%
          echo ABE_MASTER_BUILD=%ABE_MASTER_BUILD%
          echo ANT_HOME=%ANT_HOME%
          echo CHECKOUT_DIR=%CHECKOUT_DIR%
          echo BUILD_OUTPUT_DIR=%BUILD_OUTPUT_DIR%
          echo PACKAGE_NAME=%PACKAGE_NAME%
          echo TARGET_ENVIRONMENT=%TARGET_ENVIRONMENT%
          echo TARGET_ISGROUP_ALIAS=%TARGET_ISGROUP_ALIAS%
          echo BUILD_NUMBER=%MAIN_BUILDNUMBER%
          if not exist "%ANT_HOME%\bin\ant.bat" (
              echo ERROR: Ant executable not found.
              exit /b 1
          )
          if not exist "%ABE_MASTER_BUILD%" (
              echo ERROR: ABE master build.xml not found.
              exit /b 1
          )
          echo.
          echo Starting ABE master build...
          call "%ANT_HOME%\bin\ant.bat" ^
            -DtargetISGroupAlias="%TARGET_ISGROUP_ALIAS%" ^
            -DCHECKOUT_DIR="%CHECKOUT_DIR%" ^
            -DtargetEnv="%TARGET_ENVIRONMENT%" ^
            -DSAGHome="C:\SoftwareAG11_ABE" ^
            -DprojectName="%PACKAGE_NAME%_%MAIN_BUILDNUMBER%" ^
            -f "%ABE_MASTER_BUILD%" ^
            build
          set "ABE_EXIT_CODE=%ERRORLEVEL%"
          echo.
          echo ABE Exit Code: %ABE_EXIT_CODE%
          if not "%ABE_EXIT_CODE%"=="0" (
              echo ERROR: ABE Build FAILED.
              exit /b %ABE_EXIT_CODE%
          )
          echo ABE Build completed successfully.
      # =====================================================
      # 11. Verify ABE artifact
      # =====================================================
      - name: Verify ABE Deployment Artifact
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "VERIFY ABE DEPLOYMENT ARTIFACT"
          Write-Host "============================================"
          if (-not (Test-Path -LiteralPath $env:ABE_IS_OUTPUT_DIR)) {
            Write-Error "ABE IS output directory not found: $env:ABE_IS_OUTPUT_DIR"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:ABE_COMPOSITE)) {
            Write-Error "Expected cicdDemo.zip not found: $env:ABE_COMPOSITE"
            Write-Host "Available artifacts:"
            Get-ChildItem -LiteralPath $env:ABE_IS_OUTPUT_DIR -Force
            exit 1
          }
          Write-Host "cicdDemo.zip found successfully."
      # =====================================================
      # 12. Dependency configuration gate
      # =====================================================
      - name: Validate Dependency Configuration
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "DEPENDENCY CONFIGURATION"
          Write-Host "============================================"
          [xml]$xml = Get-Content -LiteralPath $env:PROJECT_AUTOMATOR_XML
          $project = $xml.DeployerSpec.Projects.Project
          if ($null -eq $project) {
            Write-Error "Project definition was not found in ProjectAutomator.xml."
            exit 1
          }
          Write-Host "Project: $($project.name)"
          Write-Host "ignoreMissingDependencies: $($project.ignoreMissingDependencies)"
          if ($project.ignoreMissingDependencies -ne 'false') {
            Write-Error 'Set ignoreMissingDependencies="false" in ProjectAutomator.xml.'
            exit 1
          }
          Write-Host "Dependency checking is configured as blocking."
      # =====================================================
      # 13. Validate Project Automator
      # =====================================================
      - name: Validate Project Automator
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:PROJECT_AUTOMATOR)) {
            Write-Error "ProjectAutomator.bat not found."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:PROJECT_AUTOMATOR_XML)) {
            Write-Error "ProjectAutomator.xml not found."
            exit 1
          }
          Write-Host "ProjectAutomator.bat: FOUND"
          Write-Host "ProjectAutomator.xml: FOUND"
      # =====================================================
      # 14. Validate Deployer / Target IS connectivity
      # =====================================================
      - name: Validate Deployment Connectivity
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "DEPLOYMENT CONNECTIVITY"
          Write-Host "============================================"
          Write-Host "Deployer Server: $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
          Write-Host "Target IS: $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"
          $deployer = Test-NetConnection `
            -ComputerName $env:DEPLOYER_HOST `
            -Port ([int]$env:DEPLOYER_PORT) `
            -WarningAction SilentlyContinue
          if (-not $deployer.TcpTestSucceeded) {
            Write-Error "Deployer Server is not reachable."
            exit 1
          }
          Write-Host "Deployer Server connectivity: OK"
          $target = Test-NetConnection `
            -ComputerName $env:TARGET_IS_HOST `
            -Port ([int]$env:TARGET_IS_PORT) `
            -WarningAction SilentlyContinue
          if (-not $target.TcpTestSucceeded) {
            Write-Error "Target Integration Server is not reachable."
            exit 1
          }
          Write-Host "Target Integration Server connectivity: OK"
      # =====================================================
      # 15. Create / recreate deployment project
      # =====================================================
      - name: Create Deployment Project
        shell: cmd
        run: |
          echo ============================================
          echo CREATE DEPLOYMENT PROJECT
          echo ============================================
          echo Project Automator:
          echo %PROJECT_AUTOMATOR%
          echo Project XML:
          echo %PROJECT_AUTOMATOR_XML%
          echo Deployer Server:
          echo %DEPLOYER_HOST%:%DEPLOYER_PORT%
          echo Target IS:
          echo %TARGET_IS_HOST%:%TARGET_IS_PORT%
          echo Project:
          echo %DEPLOYMENT_PROJECT%
          echo Candidate:
          echo %DEPLOYMENT_CONTROL%
          call "%PROJECT_AUTOMATOR%" "%PROJECT_AUTOMATOR_XML%" ^
            > "%RUNNER_TEMP%\project_automator.log" 2>&1
          set "PA_EXIT_CODE=%ERRORLEVEL%"
          echo.
          echo PROJECT AUTOMATOR OUTPUT
          type "%RUNNER_TEMP%\project_automator.log"
          echo.
          echo Project Automator Exit Code: %PA_EXIT_CODE%
          if not "%PA_EXIT_CODE%"=="0" (
              echo ERROR: Project Automator failed.
              exit /b %PA_EXIT_CODE%
          )
          echo Project Automator completed successfully.
      # =====================================================
      # 16. Verify project exists
      # =====================================================
      - name: Verify Deployment Project
        shell: cmd
        run: |
          echo ============================================
          echo VERIFY DEPLOYMENT PROJECT
          echo ============================================
          call "%DEPLOYER_CMD%" ^
            --list ^
            -candidate project ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            > "%RUNNER_TEMP%\deployer_projects.txt" 2>&1
          set "EXIT_CODE=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\deployer_projects.txt"
          if not "%EXIT_CODE%"=="0" (
              echo ERROR: Unable to list Deployer projects.
              exit /b %EXIT_CODE%
          )
          findstr /I /C:"%DEPLOYMENT_PROJECT%" "%RUNNER_TEMP%\deployer_projects.txt" >nul
          if errorlevel 1 (
              echo ERROR: Project "%DEPLOYMENT_PROJECT%" does not exist.
              exit /b 1
          )
          echo Project exists successfully.
      # =====================================================
      # 17. Verify deployment candidate
      # =====================================================
      - name: Verify Deployment Candidate
        shell: cmd
        run: |
          echo ============================================
          echo VERIFY DEPLOYMENT CANDIDATE
          echo ============================================
          call "%DEPLOYER_CMD%" ^
            --list ^
            -candidate dc ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            > "%RUNNER_TEMP%\deployment_candidates.txt" 2>&1
          set "EXIT_CODE=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\deployment_candidates.txt"
          if not "%EXIT_CODE%"=="0" (
              echo ERROR: Unable to list deployment candidates.
              exit /b %EXIT_CODE%
          )
          findstr /I /C:"%DEPLOYMENT_CONTROL%" "%RUNNER_TEMP%\deployment_candidates.txt" >nul
          if errorlevel 1 (
              echo ERROR: Deployment candidate "%DEPLOYMENT_CONTROL%" was not found.
              exit /b 1
          )
          echo Deployment candidate exists.
      # =====================================================
      # 18. Simulate deployment / dependency check
      # =====================================================
      - name: Simulate Deployment
        shell: cmd
        run: |
          echo ============================================
          echo DEPLOYMENT SIMULATION
          echo ============================================
          echo Project: %DEPLOYMENT_PROJECT%
          echo Candidate: %DEPLOYMENT_CONTROL%
          echo Deployer: %DEPLOYER_HOST%:%DEPLOYER_PORT%
          echo Target IS: %TARGET_IS_HOST%:%TARGET_IS_PORT%
          call "%DEPLOYER_CMD%" ^
            --simulate ^
            -dc "%DEPLOYMENT_CONTROL%" ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            -reportFilePath "%RUNNER_TEMP%\DeploymentSimulationReport.xml" ^
            > "%RUNNER_TEMP%\deployment_simulation.log" 2>&1
          set "SIMULATE_EXIT_CODE=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\deployment_simulation.log"
          echo.
          echo Simulation Exit Code: %SIMULATE_EXIT_CODE%
          if not "%SIMULATE_EXIT_CODE%"=="0" (
              echo.
              echo DEPLOYMENT SIMULATION FAILED.
              echo Deployment will NOT continue.
              exit /b %SIMULATE_EXIT_CODE%
          )
          echo.
          echo DEPLOYMENT SIMULATION PASSED.
      # =====================================================
      # 19. Actual deployment
      # =====================================================
      - name: Deploy to Target Integration Server
        shell: cmd
        run: |
          echo ============================================
          echo WEBMETHODS DEPLOYMENT
          echo ============================================
          echo Deployer Server: %DEPLOYER_HOST%:%DEPLOYER_PORT%
          echo Target Integration Server: %TARGET_IS_HOST%:%TARGET_IS_PORT%
          echo Project: %DEPLOYMENT_PROJECT%
          echo Candidate: %DEPLOYMENT_CONTROL%
          call "%DEPLOYER_CMD%" ^
            --deploy ^
            -dc "%DEPLOYMENT_CONTROL%" ^
            -project "%DEPLOYMENT_PROJECT%" ^
            -host "%DEPLOYER_HOST%" ^
            -port "%DEPLOYER_PORT%" ^
            -user "%DEPLOYER_USER%" ^
            -pwd "%DEPLOYER_PASSWORD%" ^
            -reportFilePath "%RUNNER_TEMP%\DeploymentReport.xml" ^
            -force ^
            > "%RUNNER_TEMP%\deployer_deploy.log" 2>&1
          set "DEPLOYER_EXIT_CODE=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\deployer_deploy.log"
          echo.
          echo Deployer Exit Code: %DEPLOYER_EXIT_CODE%
          if not "%DEPLOYER_EXIT_CODE%"=="0" (
              echo ERROR: WebMethods deployment failed.
              exit /b %DEPLOYER_EXIT_CODE%
          )
          echo.
          echo DEPLOYMENT SUCCESSFUL.
      # =====================================================
      # 20. Verify target IS is still reachable
      # =====================================================
      - name: Verify Target Integration Server
        shell: powershell
        run: |
          $result = Test-NetConnection `
            -ComputerName $env:TARGET_IS_HOST `
            -Port ([int]$env:TARGET_IS_PORT) `
            -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) {
            Write-Error "Target Integration Server is not reachable after deployment."
            exit 1
          }
          Write-Host "Target Integration Server is reachable after deployment."
      # =====================================================
      # 21. Adapter configuration - optional placeholder
      # =====================================================
      - name: Deploy Adapter Configuration
        if: env.HAS_ADAPTERPKG == 'true'
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "ADAPTER CONFIGURATION"
          Write-Host "============================================"
          Write-Host "Target IS Group: $env:TARGET_ISGROUP_ALIAS"
          Write-Host "Adapter Config Package: $env:ADAPTER_CONFIGPKG"
          Write-Host "Repository Branch: $env:REPO_BRANCH_NAME"
          Write-Warning "Original Jenkins pipeline invokes a downstream adapter configuration job."
          Write-Warning "That job still needs to be migrated to GitHub Actions."
      # =====================================================
      # 22. Integration Test Suite - optional placeholder
      # =====================================================
      - name: Integration Test Suite
        if: env.EXECUTE_WMTEST == 'true'
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "WEBMETHODS INTEGRATION TEST SUITE"
          Write-Host "============================================"
          Write-Host "Checkout Directory: $env:CHECKOUT_DIR"
          Write-Warning "The original wmtestsuite buildTest.xml location has not been confirmed on this runner."
      # =====================================================
      # 23. Postman placeholder
      # =====================================================
      - name: Postman Unit Tests
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "POSTMAN UNIT TESTS"
          Write-Host "============================================"
          Write-Host "Postman stage."
      # =====================================================
      # 24. SonarScanner placeholder
      # =====================================================
      - name: SonarScanner Code Review
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "SONARSCANNER CODE REVIEW"
          Write-Host "============================================"
          Write-Host "SonarScanner stage."
      # =====================================================
      # 25. JMeter placeholder
      # =====================================================
      - name: JMeter Performance Test
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "JMETER PERFORMANCE TEST"
          Write-Host "============================================"
          Write-Host "JMeter stage."
      # =====================================================
      # 26. SOAPUI placeholder
      # =====================================================
      - name: SOAPUI Tests
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "SOAPUI TESTS"
          Write-Host "============================================"
          Write-Host "SOAPUI stage."
      # =====================================================
      # 27. Store all generated reports locally
      # This always runs, even when an earlier step fails.
      # =====================================================
      - name: Store Reports
        if: always()
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "STORE CI/CD REPORTS"
          Write-Host "============================================"
          $reportRoot = $env:REPORT_DIR
          $runReportDir = Join-Path $reportRoot "Run_$env:GITHUB_RUN_NUMBER"
          if (-not (Test-Path -LiteralPath $reportRoot)) {
            New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          }
          if (Test-Path -LiteralPath $runReportDir) {
            Remove-Item -LiteralPath $runReportDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $runReportDir -Force | Out-Null
          # ISCCR
          if (Test-Path -LiteralPath $env:ISCCR_LOG) {
            Copy-Item `
              -LiteralPath $env:ISCCR_LOG `
              -Destination (Join-Path $runReportDir 'ISCCR.log') `
              -Force
          }
          # Project Automator
          $projectAutomatorLog = Join-Path $env:RUNNER_TEMP 'project_automator.log'
          if (Test-Path -LiteralPath $projectAutomatorLog) {
            Copy-Item `
              -LiteralPath $projectAutomatorLog `
              -Destination (Join-Path $runReportDir 'ProjectAutomator.log') `
              -Force
          }
          # Deployer project list
          $projectList = Join-Path $env:RUNNER_TEMP 'deployer_projects.txt'
          if (Test-Path -LiteralPath $projectList) {
            Copy-Item `
              -LiteralPath $projectList `
              -Destination (Join-Path $runReportDir 'DeployerProjects.txt') `
              -Force
          }
          # Deployment candidate list
          $candidateList = Join-Path $env:RUNNER_TEMP 'deployment_candidates.txt'
          if (Test-Path -LiteralPath $candidateList) {
            Copy-Item `
              -LiteralPath $candidateList `
              -Destination (Join-Path $runReportDir 'DeploymentCandidates.txt') `
              -Force
          }
          # Simulation output
          $simulationLog = Join-Path $env:RUNNER_TEMP 'deployment_simulation.log'
          if (Test-Path -LiteralPath $simulationLog) {
            Copy-Item `
              -LiteralPath $simulationLog `
              -Destination (Join-Path $runReportDir 'DeploymentSimulation.log') `
              -Force
          }
          $simulationReport = Join-Path $env:RUNNER_TEMP 'DeploymentSimulationReport.xml'
          if (Test-Path -LiteralPath $simulationReport) {
            Copy-Item `
              -LiteralPath $simulationReport `
              -Destination (Join-Path $runReportDir 'DeploymentSimulationReport.xml') `
              -Force
          }
          # Deployment output
          $deployLog = Join-Path $env:RUNNER_TEMP 'deployer_deploy.log'
          if (Test-Path -LiteralPath $deployLog) {
            Copy-Item `
              -LiteralPath $deployLog `
              -Destination (Join-Path $runReportDir 'DeployerDeployment.log') `
              -Force
          }
          $deployReport = Join-Path $env:RUNNER_TEMP 'DeploymentReport.xml'
          if (Test-Path -LiteralPath $deployReport) {
            Copy-Item `
              -LiteralPath $deployReport `
              -Destination (Join-Path $runReportDir 'DeploymentReport.xml') `
              -Force
          }
          # Environment summary
          $summaryFile = Join-Path $runReportDir 'EnvironmentSummary.txt'
          $summaryLines = @(
            'WEBMETHODS CI/CD REPORT'
            '======================='
            ''
            "Repository: $env:GITHUB_REPOSITORY"
            "Branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            "Run Number: $env:GITHUB_RUN_NUMBER"
            "Runner: $env:RUNNER_NAME"
            "Computer: $env:COMPUTERNAME"
            ''
            "Package: $env:PACKAGE_NAME"
            "Target Environment: $env:TARGET_ENVIRONMENT"
            "Target IS Group: $env:TARGET_ISGROUP_ALIAS"
            ''
            "Checkout Directory: $env:CHECKOUT_DIR"
            "Build Output: $env:BUILD_OUTPUT_DIR"
            "ABE: $env:ABE_HOME"
            "ABE Master Build: $env:ABE_MASTER_BUILD"
            ''
            "Deployer Server: $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
            "Target Integration Server: $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"
            "Deployment Project: $env:DEPLOYMENT_PROJECT"
            "Deployment Candidate: $env:DEPLOYMENT_CONTROL"
            ''
            "Report Directory: $runReportDir"
          )
          $summaryLines | Set-Content -LiteralPath $summaryFile -Encoding UTF8
          # ZIP archive
          $zipFile = Join-Path $reportRoot "WebMethods_CICD_Run_$env:GITHUB_RUN_NUMBER.zip"
          if (Test-Path -LiteralPath $zipFile) {
            Remove-Item -LiteralPath $zipFile -Force
          }
          Compress-Archive `
            -Path "$runReportDir\*" `
            -DestinationPath $zipFile `
            -Force
          Write-Host ""
          Write-Host "Reports stored under:"
          Write-Host $runReportDir
          Write-Host ""
          Write-Host "ZIP report:"
          Write-Host $zipFile
          Get-ChildItem -LiteralPath $runReportDir -Recurse -Force
      # =====================================================
      # 28. Upload a copy to GitHub Actions artifacts
      # =====================================================
      - name: Upload CI-CD Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebMethods-CICD-Reports-${{ github.run_number }}
          path: |
            C:\SoftwareAG\tools\Report\Run_${{ github.run_number }}\**
            C:\SoftwareAG\tools\Report\WebMethods_CICD_Run_${{ github.run_number }}.zip
          if-no-files-found: warn

      # =====================================================
      # 29. Final summary
      # =====================================================
      - name: Environment Summary
        if: always()
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host "WEBMETHODS CI/CD SUMMARY"
          Write-Host "============================================"
          Write-Host "Runner              : $env:RUNNER_NAME"
          Write-Host "Computer            : $env:COMPUTERNAME"
          Write-Host "Repository          : $env:GITHUB_REPOSITORY"
          Write-Host "Branch              : $env:GITHUB_REF_NAME"
          Write-Host "Commit              : $env:GITHUB_SHA"
          Write-Host "Package             : $env:PACKAGE_NAME"
          Write-Host "Target Environment  : $env:TARGET_ENVIRONMENT"
          Write-Host "Target IS Group     : $env:TARGET_ISGROUP_ALIAS"
          Write-Host "Build Number        : $env:MAIN_BUILDNUMBER"
          Write-Host "Checkout            : $env:CHECKOUT_DIR"
          Write-Host "Build Output        : $env:BUILD_OUTPUT_DIR"
          Write-Host "Report Directory    : $env:REPORT_DIR"
          Write-Host "Java                : $env:JAVA_HOME"
          Write-Host "ABE                 : $env:ABE_HOME"
          Write-Host "ABE Master Build    : $env:ABE_MASTER_BUILD"
          Write-Host "ISCCR               : $env:ISCCR_HOME"
          Write-Host "Project Automator   : $env:PROJECT_AUTOMATOR"
          Write-Host "Deployer Server     : $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"
          Write-Host "Target IS           : $env:TARGET_IS_HOST`:$env:TARGET_IS_PORT"
          Write-Host "Deployment Project  : $env:DEPLOYMENT_PROJECT"
          Write-Host "Deployment Candidate: $env:DEPLOYMENT_CONTROL"
          Write-Host "============================================"
          Write-Host "PIPELINE FINISHED"
          Write-Host "============================================"
