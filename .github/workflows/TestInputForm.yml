name: WebMethods Deployment

on:
  workflow_dispatch:

    inputs:

      environment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - DEV
          - QA
          - UAT
          - PROD

      package_name:
        description: "Enter webMethods package name"
        required: true
        type: string

      version:
        description: "Enter artifact/build version"
        required: true
        type: string

      deploy_tn:
        description: "Deploy Trading Networks assets?"
        required: true
        type: boolean
        default: false

      comments:
        description: "Deployment comments"
        required: false
        type: string


jobs:

  deploy:

    # Connect the selected environment
    environment:
      name: ${{ inputs.environment }}

    runs-on: windows-latest

    steps:

      - name: Display deployment information
        shell: powershell
        run: |

          Write-Host "================================="
          Write-Host "WebMethods Deployment"
          Write-Host "================================="

          Write-Host "Environment : ${{ inputs.environment }}"
          Write-Host "Package     : ${{ inputs.package_name }}"
          Write-Host "Version     : ${{ inputs.version }}"
          Write-Host "Deploy TN   : ${{ inputs.deploy_tn }}"
          Write-Host "Comments    : ${{ inputs.comments }}"

      - name: Deploy
        shell: powershell
        run: |

          .\deploy.ps1 `
            -Environment "${{ inputs.environment }}" `
            -PackageName "${{ inputs.package_name }}" `
            -Version "${{ inputs.version }}" `
            -DeployTN "${{ inputs.deploy_tn }}"
