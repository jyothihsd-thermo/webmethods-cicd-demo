name: Thermofisher_Devops_NonPROD_withDeployActions

on:
  workflow_dispatch:
    inputs:

      action:
        description: "Select the CI/CD action to execute"
        required: true
        type: choice
        options:
          - Build
          - Build and Deploy
          - Deploy

      buildToDeploy:
        description: "Existing ABE build to deploy, e.g. build.10.15.131"
        required: false
        type: string

      targetEnvironment:
        description: "Target environment"
        required: true
        type: string

      deploymentScope:
        description: "Deployment scope"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE
        default: ALL

      packageName:
        description: "Package name(s) for SELECTIVE deployment, comma-separated"
        required: false
        type: string

      projectName:
        description: "ABE/CI-CD project name"
        required: true
        type: string

      targetISGroupAlias:
        description: "Target IS Group Alias"
        required: true
        type: string

      buildNumber:
        description: "Build number (required for Build and Build and Deploy)"
        required: false
        type: string

      hasAdapterPackage:
        description: "Does deployment contain an Adapter package?"
        required: true
        type: boolean
        default: false

      adapterConfigPackage:
        description: "Adapter configuration package"
        required: false
        type: string

      RepoBranchName:
        description: "Repository branch"
        required: true
        type: string
        default: main

      executeWmTestSuite:
        description: "Execute webMethods Test Suite"
        required: true
        type: boolean
        default: false


jobs:

  Thermofisher_Devops_NonPROD_withDeployActions:

    runs-on:
      - self-hosted
      - windows
      - webmethods

    env:

      # ============================================================
      # CI/CD Installation / Workspace Configuration
      # ============================================================

      CICD_HOME: C:/devops/sagdevops-cicd

      SAG_BUILD_HOME: C:/SoftwareAG11_ABE

      SAG_HOME: C:/SoftwareAG11_ABE

      ANT_HOME: C:/SoftwareAG11_ABE/common/lib/ant

      JAVA_HOME: C:/SoftwareAG11/jvm/jvm/bin

      CHECKOUT_DIR: C:/SoftwareAG/tools/Checkout

      SELECTIVE_SOURCE_DIR: C:/SoftwareAG/tools/CheckoutSelective


      # ============================================================
      # GitHub Actions Inputs
      # ============================================================

      ACTION: ${{ inputs.action }}
      BUILD_TO_DEPLOY: ${{ inputs.buildToDeploy }}

      TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

      DEPLOYMENT_SCOPE: ${{ inputs.deploymentScope }}

      ISPACKAGES_LIST: ${{ inputs.packageName }}

      PROJECT_NAME: ${{ inputs.projectName }}

      TARGET_ISGROUP_ALIAS: ${{ inputs.targetISGroupAlias }}

      MAIN_BUILDNUMBER: ${{ inputs.buildNumber }}

      HAS_ADAPTERPKG: ${{ inputs.hasAdapterPackage }}

      ADAPTER_CONFIGPKG: ${{ inputs.adapterConfigPackage }}

      REPO_BRANCH_NAME: ${{ inputs.RepoBranchName }}

      EXECUTE_WMTEST: ${{ inputs.executeWmTestSuite }}


    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================

      - name: Checkout Repository
        if: ${{ inputs.action != 'Deploy' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.RepoBranchName }}
          clean: true


      # ============================================================
      # 2. Validate Required Inputs
      # ============================================================

      - name: Validate Required Inputs
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Validating workflow inputs"
          Write-Host "=================================================="

          Write-Host "Action                : [$env:ACTION]"
          Write-Host "Build To Deploy       : [$env:BUILD_TO_DEPLOY]"
          Write-Host "Target Environment    : [$env:TARGET_ENVIRONMENT]"
          Write-Host "Deployment Scope      : [$env:DEPLOYMENT_SCOPE]"
          Write-Host "Package List          : [$env:ISPACKAGES_LIST]"
          Write-Host "Project Name          : [$env:PROJECT_NAME]"
          Write-Host "Target IS Group Alias : [$env:TARGET_ISGROUP_ALIAS]"
          Write-Host "Build Number          : [$env:MAIN_BUILDNUMBER]"
          Write-Host "Repository Branch     : [$env:REPO_BRANCH_NAME]"
          Write-Host "Has Adapter Package   : [$env:HAS_ADAPTERPKG]"
          Write-Host "Adapter Config        : [$env:ADAPTER_CONFIGPKG]"
          Write-Host "Execute WM Test       : [$env:EXECUTE_WMTEST]"

          if ([string]::IsNullOrWhiteSpace($env:TARGET_ENVIRONMENT)) {
              Write-Error "Target environment is required."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:PROJECT_NAME)) {
              Write-Error "ABE/CI-CD project name is required."
              exit 1
          }

          if ($env:ACTION -notin @("Build", "Build and Deploy", "Deploy")) {
              Write-Error "Invalid action: [$env:ACTION]. Allowed values are Build, Build and Deploy, Deploy."
              exit 1
          }

          if ($env:ACTION -in @("Build", "Build and Deploy")) {
              if ([string]::IsNullOrWhiteSpace($env:MAIN_BUILDNUMBER)) {
                  Write-Error "Build number is required for action [$env:ACTION]."
                  exit 1
              }
          }

          if ($env:ACTION -in @("Build and Deploy", "Deploy")) {
              if ([string]::IsNullOrWhiteSpace($env:TARGET_ISGROUP_ALIAS)) {
                  Write-Error "Target IS Group Alias is required for action [$env:ACTION]."
                  exit 1
              }
          }

          if ($env:ACTION -eq "Deploy") {

              if ([string]::IsNullOrWhiteSpace($env:BUILD_TO_DEPLOY)) {
                  Write-Error "buildToDeploy is required when action is Deploy."
                  exit 1
              }

              if ($env:BUILD_TO_DEPLOY -match '[\\/:]') {
                  Write-Error "Invalid build name. Use an ABE build directory name such as build.10.15.131."
                  exit 1
              }

              $buildPath = Join-Path "C:\buildsBackup" $env:BUILD_TO_DEPLOY

              Write-Host "Requested Build       : [$env:BUILD_TO_DEPLOY]"
              Write-Host "Existing Build Path   : [$buildPath]"

              if (-not (Test-Path $buildPath -PathType Container)) {
                  Write-Error "Requested build does not exist: $buildPath"
                  exit 1
              }

              Write-Host "Existing build found successfully."
          }

          if ($env:DEPLOYMENT_SCOPE -eq "SELECTIVE") {

              if ([string]::IsNullOrWhiteSpace($env:ISPACKAGES_LIST)) {
                  Write-Error "Package name(s) are required when deployment scope is SELECTIVE."
                  exit 1
              }
          }

          Write-Host ""
          Write-Host "Required input validation successful."


      # ============================================================
      # 3. Mirror GitHub Workspace to Fixed Checkout Directory
      # ============================================================

      - name: Mirror Repository to Checkout Directory
        if: ${{ inputs.action != 'Deploy' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Mirroring GitHub workspace"
          Write-Host "=================================================="

          Write-Host "Source      : [$env:GITHUB_WORKSPACE]"
          Write-Host "Destination : [$env:CHECKOUT_DIR]"

          if (-not (Test-Path $env:CHECKOUT_DIR)) {
              New-Item `
                  -ItemType Directory `
                  -Path $env:CHECKOUT_DIR `
                  -Force |
                  Out-Null
          }

          robocopy `
              "$env:GITHUB_WORKSPACE" `
              "$env:CHECKOUT_DIR" `
              /MIR `
              /XD ".git"

          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $robocopyExitCode"

          if ($robocopyExitCode -ge 8) {
              Write-Error `
                  "Repository mirror failed. Robocopy exit code: $robocopyExitCode"
              exit 1
          }

          exit 0


      # ============================================================
      # 4. Prepare Build Source
      #
      # ALL:
      #   C:/SoftwareAG/tools/Checkout/is/packages
      #
      # SELECTIVE:
      #   C:/SoftwareAG/tools/CheckoutSelective
      #
      # Robocopy exit codes:
      #   0-7 = success
      #   8+  = failure
      # ============================================================

      - name: Prepare Build Source
        if: ${{ inputs.action != 'Deploy' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Preparing build source"
          Write-Host "=================================================="

          Write-Host "Deployment Scope : [$env:DEPLOYMENT_SCOPE]"
          Write-Host "Package List     : [$env:ISPACKAGES_LIST]"

          # --------------------------------------------------------
          # ALL PACKAGE DEPLOYMENT
          # --------------------------------------------------------

          if ($env:DEPLOYMENT_SCOPE -eq "ALL") {

              $buildSourceDir = "$env:CHECKOUT_DIR/is/packages"

              Write-Host ""
              Write-Host "ALL deployment selected."
              Write-Host "Build source directory:"
              Write-Host "[$buildSourceDir]"

              if (-not (Test-Path $buildSourceDir)) {

                  Write-Error `
                      "Build source directory does not exist: $buildSourceDir"

                  exit 1
              }
          }

          # --------------------------------------------------------
          # SELECTIVE PACKAGE DEPLOYMENT
          # --------------------------------------------------------

          elseif ($env:DEPLOYMENT_SCOPE -eq "SELECTIVE") {

              Write-Host ""
              Write-Host "SELECTIVE deployment selected."

              $buildSourceDir = $env:SELECTIVE_SOURCE_DIR

              Write-Host "Selective build source directory:"
              Write-Host "[$buildSourceDir]"

              # Clean previous selective build source

              if (Test-Path $buildSourceDir) {

                  Write-Host ""
                  Write-Host "Cleaning previous selective source directory."

                  Remove-Item `
                      $buildSourceDir `
                      -Recurse `
                      -Force
              }

              New-Item `
                  -ItemType Directory `
                  -Path $buildSourceDir `
                  -Force |
                  Out-Null


              # ----------------------------------------------------
              # Parse comma-separated package names
              # ----------------------------------------------------

              $packages = $env:ISPACKAGES_LIST `
                  -split "," |
                  ForEach-Object {
                      $_.Trim()
                  } |
                  Where-Object {
                      -not [string]::IsNullOrWhiteSpace($_)
                  } |
                  Select-Object -Unique


              if ($packages.Count -eq 0) {

                  Write-Error `
                      "No valid package names were supplied for SELECTIVE deployment."

                  exit 1
              }


              Write-Host ""
              Write-Host "Packages selected for deployment:"

              foreach ($package in $packages) {
                  Write-Host "  - [$package]"
              }


              # ----------------------------------------------------
              # Copy each selected package
              # ----------------------------------------------------

              foreach ($packageName in $packages) {

                  Write-Host ""
                  Write-Host "--------------------------------------------------"
                  Write-Host "Processing package: [$packageName]"
                  Write-Host "--------------------------------------------------"


                  # Prevent path traversal / invalid paths

                  if (
                      $packageName.Contains("..") -or
                      $packageName.Contains("/") -or
                      $packageName.Contains("\") -or
                      $packageName.Contains(":")
                  ) {

                      Write-Error `
                          "Invalid package name: [$packageName]"

                      exit 1
                  }


                  $sourcePackage = Join-Path `
                      "$env:CHECKOUT_DIR/is/packages" `
                      $packageName

                  $targetPackage = Join-Path `
                      $buildSourceDir `
                      $packageName


                  Write-Host "Source package:"
                  Write-Host "[$sourcePackage]"

                  Write-Host "Target package:"
                  Write-Host "[$targetPackage]"


                  # Validate source package

                  if (-not (Test-Path $sourcePackage)) {

                      Write-Error `
                          "Package does not exist: $sourcePackage"

                      exit 1
                  }


                  # Create target package directory

                  New-Item `
                      -ItemType Directory `
                      -Path $targetPackage `
                      -Force |
                      Out-Null


                  # ------------------------------------------------
                  # Robocopy
                  # ------------------------------------------------

                  robocopy `
                      "$sourcePackage" `
                      "$targetPackage" `
                      /E

                  $robocopyExitCode = $LASTEXITCODE

                  Write-Host ""
                  Write-Host "Robocopy exit code: $robocopyExitCode"


                  # Robocopy:
                  # 0-7 = successful completion
                  # 8+  = failure

                  if ($robocopyExitCode -ge 8) {

                      Write-Error `
                          "Failed to copy package [$packageName]. Robocopy exit code: $robocopyExitCode"

                      exit 1
                  }

                  Write-Host `
                      "Package [$packageName] copied successfully."
              }
          }

          else {

              Write-Error `
                  "Invalid deployment scope: [$env:DEPLOYMENT_SCOPE]"

              exit 1
          }


          # ========================================================
          # Persist BUILD_SOURCE_DIR for subsequent workflow steps
          # ========================================================

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "Build source prepared successfully"
          Write-Host "=================================================="

          Write-Host "BUILD_SOURCE_DIR = [$buildSourceDir]"

          "BUILD_SOURCE_DIR=$buildSourceDir" |
              Out-File `
                  $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append


          # IMPORTANT:
          # Robocopy may return 1-7 even when the copy succeeded.
          # Explicitly return 0 so GitHub Actions marks this step
          # as successful.

          exit 0


      # ============================================================
      # 5. Verify Build Source
      # ============================================================

      - name: Verify Build Source
        if: ${{ inputs.action != 'Deploy' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Verifying build source"
          Write-Host "=================================================="

          Write-Host "BUILD_SOURCE_DIR = [$env:BUILD_SOURCE_DIR]"

          if ([string]::IsNullOrWhiteSpace($env:BUILD_SOURCE_DIR)) {

              Write-Error "BUILD_SOURCE_DIR is not set."
              exit 1
          }

          if (-not (Test-Path $env:BUILD_SOURCE_DIR)) {

              Write-Error `
                  "BUILD_SOURCE_DIR does not exist: $env:BUILD_SOURCE_DIR"

              exit 1
          }

          Write-Host ""
          Write-Host "Build source contents:"

          Get-ChildItem `
              -Path $env:BUILD_SOURCE_DIR `
              -Directory |
              Select-Object Name, FullName |
              Format-Table -AutoSize

          exit 0


      # ============================================================
      # 6. Verify ABE / Ant Installation
      # ============================================================

      - name: Verify ABE and Ant Installation
        if: ${{ inputs.action != 'Deploy' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Verifying ABE / Ant installation"
          Write-Host "=================================================="

          $antExecutable = "$env:SAG_HOME/common/lib/ant/bin/ant.bat"

          $antBuildFile = `
              "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml"

          $abeBuildProperties = `
              "$env:SAG_HOME/common/AssetBuildEnvironment/master_build/build.properties"


          Write-Host "SAG_HOME             : [$env:SAG_HOME]"
          Write-Host "CICD_HOME            : [$env:CICD_HOME]"
          Write-Host "Ant executable       : [$antExecutable]"
          Write-Host "Ant build file       : [$antBuildFile]"
          Write-Host "ABE build.properties : [$abeBuildProperties]"


          if (-not (Test-Path $antExecutable)) {

              Write-Error `
                  "Ant executable does not exist: $antExecutable"

              exit 1
          }


          if (-not (Test-Path $antBuildFile)) {

              Write-Error `
                  "CI/CD Ant build file does not exist: $antBuildFile"

              exit 1
          }


          if (-not (Test-Path $abeBuildProperties)) {

              Write-Error `
                  "ABE build.properties does not exist: $abeBuildProperties"

              exit 1
          }


          Write-Host ""
          Write-Host "ABE / Ant validation successful."

          exit 0


      # ============================================================
      # 7. Build using ABE
      # ============================================================

      - name: Build with ABE
        if: ${{ inputs.action != 'Deploy' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Starting ABE build"
          Write-Host "=================================================="


          $antExecutable = `
              "$env:SAG_HOME/common/lib/ant/bin/ant.bat"

          $antBuildFile = `
              "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml"


          Write-Host "SAG_HOME         = [$env:SAG_HOME]"
          Write-Host "SAG_CI_HOME      = [$env:CICD_HOME/cicd/scripts/build-and-deploy/setup]"
          Write-Host "SOURCE_DIR       = [$env:BUILD_SOURCE_DIR]"
          Write-Host "targetEnv        = [$env:TARGET_ENVIRONMENT]"
          Write-Host "buildNumber      = [$env:MAIN_BUILDNUMBER]"
          Write-Host "projectName      = [$env:PROJECT_NAME]"
          Write-Host ""


          & $antExecutable `
              "-DSAGHome=$env:SAG_HOME" `
              "-DSAG_CI_HOME=$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
              "-DSOURCE_DIR=$env:BUILD_SOURCE_DIR" `
              "-DtargetEnv=$env:TARGET_ENVIRONMENT" `
              "-DbuildNumber=$env:MAIN_BUILDNUMBER" `
              "-DprojectName=$env:PROJECT_NAME" `
              -f "$antBuildFile" `
              build


          if ($LASTEXITCODE -ne 0) {

              Write-Error "webMethods ABE build failed."
              exit 1
          }


          Write-Host ""
          Write-Host "ABE build completed successfully."

          exit 0


      # ============================================================
      # 8. Prepare Deployment Configuration
      # ============================================================

      - name: Prepare Deployment Configuration
        if: ${{ inputs.action != 'Build' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Preparing deployment configuration"
          Write-Host "=================================================="


          Write-Host "Project Name           = [$env:PROJECT_NAME]"
          Write-Host "Target Environment     = [$env:TARGET_ENVIRONMENT]"
          Write-Host "Target IS Group Alias  = [$env:TARGET_ISGROUP_ALIAS]"
          Write-Host "Build Number           = [$env:MAIN_BUILDNUMBER]"
          Write-Host "Adapter Package        = [$env:HAS_ADAPTERPKG]"
          Write-Host "Adapter Config Package = [$env:ADAPTER_CONFIGPKG]"
          Write-Host "Execute WM Test        = [$env:EXECUTE_WMTEST]"


          if ($env:HAS_ADAPTERPKG -eq "true") {

              Write-Host ""
              Write-Host "Adapter package deployment requested."


              if ([string]::IsNullOrWhiteSpace($env:ADAPTER_CONFIGPKG)) {

                  Write-Error `
                      "Adapter configuration package is required when hasAdapterPackage is true."

                  exit 1
              }


              Write-Host `
                  "Adapter configuration package: [$env:ADAPTER_CONFIGPKG]"
          }
          else {

              Write-Host ""
              Write-Host "No Adapter package deployment requested."
          }


          exit 0


      # ============================================================
      # 9. Execute webMethods Test Suite
      # ============================================================

      - name: Execute webMethods Test Suite
        if: ${{ inputs.executeWmTestSuite == true && inputs.action != 'Build' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "webMethods Test Suite"
          Write-Host "=================================================="

          Write-Host "Test Suite execution requested."

          # Add WM Test Suite execution command here
          # when the test execution command is finalized.

          exit 0


      # ============================================================
      # 10. Deploy using Project Automator + Deployer
      # ============================================================

      - name: Deploy with Project Automator and Deployer
        if: ${{ inputs.action != 'Build' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Starting webMethods deployment"
          Write-Host "=================================================="


          $antExecutable = `
              "$env:SAG_HOME/common/lib/ant/bin/ant.bat"

          $antBuildFile = `
              "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml"


          Write-Host ""
          Write-Host "Deployment parameters:"
          Write-Host "action               = [$env:ACTION]"
          Write-Host "buildToDeploy        = [$env:BUILD_TO_DEPLOY]"
          Write-Host "SAG_HOME             = [$env:SAG_HOME]"
          Write-Host "SAG_CI_HOME          = [$env:CICD_HOME/cicd/scripts/build-and-deploy/setup]"
          Write-Host "SOURCE_DIR           = [$env:BUILD_SOURCE_DIR]"
          Write-Host "targetEnv            = [$env:TARGET_ENVIRONMENT]"
          Write-Host "targetISGroupAlias   = [$env:TARGET_ISGROUP_ALIAS]"
          Write-Host "buildNumber          = [$env:MAIN_BUILDNUMBER]"
          Write-Host "projectName          = [$env:PROJECT_NAME]"
          Write-Host ""


          # IMPORTANT:
          #
          # buildDeployer.xml expects:
          #
          #     targetISGroupAlias
          #
          # Therefore the command line MUST use:
          #
          #     -DtargetISGroupAlias
          #
          # Do NOT use:
          #
          #     -DisGroupAlias
          #

          Write-Host "Ant target alias argument:"
          Write-Host "-DtargetISGroupAlias=$env:TARGET_ISGROUP_ALIAS"
          Write-Host ""


          & $antExecutable `
              "-DSAGHome=$env:SAG_HOME" `
              "-DSAG_CI_HOME=$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
              "-Daction=$env:ACTION" `
              "-DbuildToDeploy=$env:BUILD_TO_DEPLOY" `
              "-DbuildBackupDir=C:/buildsBackup" `
              "-DSOURCE_DIR=$env:BUILD_SOURCE_DIR" `
              "-DtargetEnv=$env:TARGET_ENVIRONMENT" `
              "-DtargetISGroupAlias=$env:TARGET_ISGROUP_ALIAS" `
              "-DbuildNumber=$env:MAIN_BUILDNUMBER" `
              "-DprojectName=$env:PROJECT_NAME" `
              -f "$antBuildFile" `
              deploy


          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                  "WebMethods Deployer execution failed."

              exit 1
          }


          Write-Host ""
          Write-Host "=================================================="
          Write-Host "Deployment completed successfully."
          Write-Host "=================================================="


          exit 0


      # ============================================================

# 11. Verify Generated Deployer Specification
      # ============================================================

      - name: Verify Generated Deployer Specification
        if: ${{ inputs.action != 'Build' }}
        shell: powershell
        run: |

          Write-Host "=================================================="
          Write-Host "Verifying generated Deployer specification"
          Write-Host "=================================================="


          $specFile = `
              "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/ProjectAutomator/$env:PROJECT_NAME" +
              "DeploymentSpec.xml"


          Write-Host "Specification file:"
          Write-Host "[$specFile]"


          if (-not (Test-Path $specFile)) {

              Write-Error `
                  "Deployer specification was not found: $specFile"

              exit 1
          }


          Write-Host ""
          Write-Host "Target IS alias from generated specification:"


          Get-Content $specFile |
              Select-String -Pattern "<alias"


          $aliasLine = Get-Content $specFile |
              Select-String -Pattern '<alias type="IS">'


          if ($aliasLine -notmatch [regex]::Escape($env:TARGET_ISGROUP_ALIAS)) {

              Write-Error `
                  "Generated Deployer specification does not contain expected target IS Group Alias [$env:TARGET_ISGROUP_ALIAS]."

              exit 1
          }


          Write-Host ""
          Write-Host "Generated Deployer specification contains the expected target alias:"
          Write-Host "[$env:TARGET_ISGROUP_ALIAS]"

          exit 0

