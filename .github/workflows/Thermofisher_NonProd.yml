name: Thermofisher_Dev

on:
  workflow_dispatch:
    inputs:

      # ==========================================================
      # TARGET ENVIRONMENT
      # ==========================================================
      targetEnvironment:
        description: "Target Environment"
        required: true
        type: string

      # ==========================================================
      # DEPLOYMENT SCOPE
      #
      # ALL       -> Build all packages
      # SELECTIVE -> Build only packages specified in packageName
      # ==========================================================
      deploymentScope:
        description: "Deployment Scope"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE
        default: ALL

      # ==========================================================
      # PACKAGE NAME
      #
      # For SELECTIVE:
      # Example:
      #   cicdDemo
      #
      # Multiple packages:
      #   cicdDemo,ThermoDemo1
      # ==========================================================
      packageName:
        description: "IS Package name(s) for SELECTIVE deployment - comma separated"
        required: false
        type: string
        default: ""

      # ==========================================================
      # TARGET IS GROUP
      # ==========================================================
      targetISGroupAlias:
        description: "Target IS Group Alias"
        required: true
        type: string

      # ==========================================================
      # BUILD NUMBER
      # ==========================================================
      buildNumber:
        description: "Build Number"
        required: true
        type: string

      # ==========================================================
      # ADAPTER PACKAGE
      # ==========================================================
      hasAdapterPackage:
        description: "Has Adapter Package"
        required: true
        type: boolean
        default: false

      adapterConfigPackage:
        description: "Adapter Configuration Package"
        required: false
        type: string
        default: ""

      # ==========================================================
      # GIT BRANCH
      # ==========================================================
      RepoBranchName:
        description: "Repository Branch"
        required: true
        type: string
        default: "main"

      # ==========================================================
      # WEBMETHODS TEST SUITE
      # ==========================================================
      executeWmTestSuite:
        description: "Execute WM Test Suite"
        required: true
        type: boolean
        default: false


jobs:

  Thermofisher_NonProd:

    runs-on:
      - self-hosted
      - windows
      - webmethods

    env:

      # ==========================================================
      # WEBMETHODS INSTALLATION
      # ==========================================================

      CICD_HOME: "C:/devops/sagdevops-cicd"

      SAG_BUILD_HOME: "C:/SoftwareAG11_ABE"

      SAG_HOME: "C:/SoftwareAG11"

      ANT_HOME: "C:/SoftwareAG11_ABE/common/lib/ant"

      JAVA_HOME: "C:/SoftwareAG11/jvm/jvm/bin"


      # ==========================================================
      # CHECKOUT DIRECTORIES
      # ==========================================================

      CHECKOUT_DIR: "C:/SoftwareAG/tools/Checkout"

      SELECTIVE_SOURCE_DIR: "C:/SoftwareAG/tools/CheckoutSelective"


      # ==========================================================
      # WORKFLOW INPUTS
      # ==========================================================

      TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

      DEPLOYMENT_SCOPE: ${{ inputs.deploymentScope }}

      ISPACKAGES_LIST: ${{ inputs.packageName }}

      TARGET_ISGROUP_ALIAS: ${{ inputs.targetISGroupAlias }}

      MAIN_BUILDNUMBER: ${{ inputs.buildNumber }}

      HAS_ADAPTERPKG: ${{ inputs.hasAdapterPackage }}

      ADAPTER_CONFIGPKG: ${{ inputs.adapterConfigPackage }}

      REPO_BRANCH_NAME: ${{ inputs.RepoBranchName }}

      EXECUTE_WMTEST: ${{ inputs.executeWmTestSuite }}


    steps:

      # ==========================================================
      # STEP 1
      # CHECKOUT GITHUB REPOSITORY
      # ==========================================================

      - name: Checkout GitHub Repository

        uses: actions/checkout@v4

        with:

          # Explicitly checkout the branch supplied as workflow input
          ref: ${{ inputs.RepoBranchName }}

          # Clean the GitHub workspace before checkout
          clean: true


      # ==========================================================
      # STEP 2
      # COPY GITHUB WORKSPACE TO FIXED WEBMETHODS CHECKOUT DIR
      #
      # GitHub Actions workspace:
      #
      # C:\SoftwareAG\actions-runner\_work\...
      #
      # is copied to:
      #
      # C:\SoftwareAG\tools\Checkout
      #
      # WebMethods configuration currently expects CHECKOUT_DIR.
      # ==========================================================

      - name: Prepare WebMethods Checkout Directory

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Preparing WebMethods Checkout Directory"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "WebMethods Checkout Directory:"
          Write-Host $env:CHECKOUT_DIR


          # ======================================================
          # CLEAN / CREATE CHECKOUT DIRECTORY
          # ======================================================

          if (Test-Path $env:CHECKOUT_DIR) {

              Write-Host ""
              Write-Host "Cleaning existing checkout directory..."

              Remove-Item `
                -Path "$env:CHECKOUT_DIR\*" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          else {

              Write-Host ""
              Write-Host "Creating checkout directory..."

              New-Item `
                -ItemType Directory `
                -Path $env:CHECKOUT_DIR `
                -Force | Out-Null
          }


          # ======================================================
          # COPY REPOSITORY
          # ======================================================

          Write-Host ""
          Write-Host "Copying GitHub repository..."

          robocopy `
            "$env:GITHUB_WORKSPACE" `
            "$env:CHECKOUT_DIR" `
            /MIR `
            /XD ".git"

          $robocopyExitCode = $LASTEXITCODE


          Write-Host ""
          Write-Host "Robocopy exit code: $robocopyExitCode"


          # ======================================================
          # ROBOCOPY EXIT CODES
          #
          # 0 - No files copied / destination already current
          # 1 - Files copied successfully
          # 2-7 - Successful / acceptable differences
          # 8+ - Failure
          # ======================================================

          if ($robocopyExitCode -ge 8) {

              Write-Error `
                "Failed to copy GitHub workspace to CHECKOUT_DIR."

              exit $robocopyExitCode
          }


          Write-Host ""
          Write-Host "Repository successfully copied."


          # ======================================================
          # DISPLAY CHECKOUT CONTENT
          # ======================================================

          Write-Host ""
          Write-Host "Checkout directory contents:"

          Get-ChildItem `
            -Path $env:CHECKOUT_DIR `
            -Force


          # ======================================================
          # IMPORTANT
          #
          # Robocopy code 1 is SUCCESS.
          # Explicitly return 0 so GitHub Actions does not
          # interpret Robocopy's code 1 as a failed PowerShell step.
          # ======================================================

          exit 0


      # ==========================================================
      # STEP 3
      # DISPLAY ENVIRONMENT
      # ==========================================================

      - name: Set Environment Variables

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "CI/CD Environment Variables"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "TARGET_ENVIRONMENT : $env:TARGET_ENVIRONMENT"

          Write-Host "DEPLOYMENT_SCOPE   : $env:DEPLOYMENT_SCOPE"

          Write-Host "ISPACKAGES_LIST    : $env:ISPACKAGES_LIST"

          Write-Host "TARGET_ISGROUP_ALIAS : $env:TARGET_ISGROUP_ALIAS"

          Write-Host "MAIN_BUILDNUMBER   : $env:MAIN_BUILDNUMBER"

          Write-Host "HAS_ADAPTERPKG     : $env:HAS_ADAPTERPKG"

          Write-Host "ADAPTER_CONFIGPKG  : $env:ADAPTER_CONFIGPKG"

          Write-Host "REPO_BRANCH_NAME   : $env:REPO_BRANCH_NAME"

          Write-Host "EXECUTE_WMTEST     : $env:EXECUTE_WMTEST"

          Write-Host "CHECKOUT_DIR       : $env:CHECKOUT_DIR"

          Write-Host "SELECTIVE_SOURCE_DIR : $env:SELECTIVE_SOURCE_DIR"


      # ==========================================================
      # STEP 4
      # VERIFY BUILD ENVIRONMENT
      # ==========================================================

      - name: Verify Build Environment

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Verifying Build Environment"
          Write-Host "=========================================="


          # ======================================================
          # JAVA
          # ======================================================

          Write-Host ""
          Write-Host "Java Version"
          Write-Host "------------"

          & "$env:JAVA_HOME\java.exe" -version


          # ======================================================
          # GIT
          # ======================================================

          Write-Host ""
          Write-Host "Git Version"
          Write-Host "-----------"

          git --version


          # ======================================================
          # ANT
          # ======================================================

          Write-Host ""
          Write-Host "Ant Version"
          Write-Host "-----------"

          & "$env:ANT_HOME\bin\ant.bat" -version


          # ======================================================
          # REQUIRED DIRECTORIES
          # ======================================================

          Write-Host ""
          Write-Host "Checking required directories"
          Write-Host "-----------------------------"


          $requiredPaths = @(

              "$env:JAVA_HOME"

              "$env:SAG_HOME"

              "$env:SAG_BUILD_HOME"

              "$env:ANT_HOME"

              "$env:CICD_HOME"

              "$env:CHECKOUT_DIR"

              "$env:CHECKOUT_DIR\is"

              "$env:CHECKOUT_DIR\is\packages"

          )


          foreach ($path in $requiredPaths) {

              Write-Host ""
              Write-Host "Checking: [$path]"


              if (-not (Test-Path $path)) {

                  Write-Error `
                    "Required path does not exist: $path"

                  exit 1
              }

              else {

                  Write-Host "OK: $path"
              }
          }


      # ==========================================================
      # STEP 5
      # PREPARE BUILD SOURCE
      #
      # ALL
      #
      # C:\SoftwareAG\tools\Checkout\is\packages
      #
      #
      # SELECTIVE
      #
      # C:\SoftwareAG\tools\CheckoutSelective
      #
      #       +-- cicdDemo
      #       +-- ThermoDemo1
      #
      # ==========================================================

      - name: Prepare Build Source

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Preparing Build Source"
          Write-Host "=========================================="


          # ======================================================
          # SOURCE PACKAGE DIRECTORY
          # ======================================================

          $sourcePackages = Join-Path `
            $env:CHECKOUT_DIR `
            "is\packages"


          $selectiveDir = $env:SELECTIVE_SOURCE_DIR


          Write-Host ""
          Write-Host "Deployment Scope : $env:DEPLOYMENT_SCOPE"

          Write-Host "Source Packages  : $sourcePackages"

          Write-Host "Selective Dir    : $selectiveDir"


          # ======================================================
          # ALL PACKAGE DEPLOYMENT
          # ======================================================

          if ($env:DEPLOYMENT_SCOPE -eq "ALL") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "ALL PACKAGE DEPLOYMENT"
              Write-Host "=========================================="


              # --------------------------------------------------
              # Verify package directory
              # --------------------------------------------------

              if (-not (Test-Path $sourcePackages)) {

                  Write-Error `
                    "IS packages directory does not exist: $sourcePackages"

                  exit 1
              }


              # --------------------------------------------------
              # Use original package directory as build source
              # --------------------------------------------------

              $buildSourceDir = $sourcePackages


              Write-Host ""
              Write-Host "Build Source Directory:"
              Write-Host $buildSourceDir
          }


          # ======================================================
          # SELECTIVE PACKAGE DEPLOYMENT
          # ======================================================

          elseif ($env:DEPLOYMENT_SCOPE -eq "SELECTIVE") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "SELECTIVE PACKAGE DEPLOYMENT"
              Write-Host "=========================================="


              # --------------------------------------------------
              # Validate package input
              # --------------------------------------------------

              if ([string]::IsNullOrWhiteSpace($env:ISPACKAGES_LIST)) {

                  Write-Error `
                    "packageName is required when deploymentScope is SELECTIVE."

                  exit 1
              }


              # --------------------------------------------------
              # Clean selective source directory
              # --------------------------------------------------

              if (Test-Path $selectiveDir) {

                  Write-Host ""
                  Write-Host "Cleaning selective source directory..."

                  Remove-Item `
                    -Path "$selectiveDir\*" `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue
              }

              else {

                  Write-Host ""
                  Write-Host "Creating selective source directory..."

                  New-Item `
                    -ItemType Directory `
                    -Path $selectiveDir `
                    -Force | Out-Null
              }


              # --------------------------------------------------
              # Convert comma-separated package list into array
              # --------------------------------------------------

              $packages = $env:ISPACKAGES_LIST `
                -split "," `
                | ForEach-Object {
                    $_.Trim()
                  } `
                | Where-Object {
                    -not [string]::IsNullOrWhiteSpace($_)
                  } `
                | Select-Object -Unique


              Write-Host ""
              Write-Host "Packages requested:"

              foreach ($package in $packages) {

                  Write-Host "  - $package"
              }


              # --------------------------------------------------
              # Copy each selected package
              # --------------------------------------------------

              foreach ($package in $packages) {

                  Write-Host ""
                  Write-Host "------------------------------------------"

                  Write-Host "Processing package: $package"

                  Write-Host "------------------------------------------"


                  # ==================================================
                  # SECURITY / PATH VALIDATION
                  # ==================================================

                  if (
                      $package.Contains("..") -or
                      $package.Contains("/") -or
                      $package.Contains("\") -or
                      $package.Contains(":")
                  ) {

                      Write-Error `
                        "Invalid package name: $package"

                      exit 1
                  }


                  # ==================================================
                  # SOURCE / TARGET
                  # ==================================================

                  $sourcePackage = Join-Path `
                    $sourcePackages `
                    $package


                  $targetPackage = Join-Path `
                    $selectiveDir `
                    $package


                  Write-Host ""
                  Write-Host "Source : $sourcePackage"

                  Write-Host "Target : $targetPackage"


                  # ==================================================
                  # VERIFY SOURCE PACKAGE
                  # ==================================================

                  if (-not (Test-Path $sourcePackage)) {

                      Write-Error `
                        "Package [$package] does not exist under [$sourcePackages]"

                      exit 1
                  }


                  # ==================================================
                  # CREATE TARGET
                  # ==================================================

                  New-Item `
                    -ItemType Directory `
                    -Path $targetPackage `
                    -Force | Out-Null


                  # ==================================================
                  # COPY PACKAGE
                  # ==================================================

                  robocopy `
                    "$sourcePackage" `
                    "$targetPackage" `
                    /E

                  $robocopyExitCode = $LASTEXITCODE


                  Write-Host ""

                  Write-Host `
                    "Robocopy exit code for [$package]: $robocopyExitCode"


                  # ==================================================
                  # 8+ = FAILURE
                  # ==================================================

                  if ($robocopyExitCode -ge 8) {

                      Write-Error `
                        "Failed to copy package [$package]."

                      exit $robocopyExitCode
                  }


                  Write-Host ""
                  Write-Host `
                    "Package [$package] copied successfully."
              }


              # ==================================================
              # SELECTIVE DIRECTORY IS THE BUILD SOURCE
              # ==================================================

              $buildSourceDir = $selectiveDir


              Write-Host ""
              Write-Host "=========================================="
              Write-Host "SELECTIVE BUILD SOURCE CREATED"
              Write-Host "=========================================="


              Write-Host ""
              Write-Host "Build Source Directory:"

              Write-Host $buildSourceDir


              Write-Host ""
              Write-Host "Selective source contents:"


              Get-ChildItem `
                -Path $buildSourceDir `
                -Force `
                -Recurse
          }


          # ======================================================
          # INVALID DEPLOYMENT SCOPE
          # ======================================================

          else {

              Write-Error `
                "Invalid deployment scope: $env:DEPLOYMENT_SCOPE"

              exit 1
          }


          # ======================================================
          # PERSIST BUILD_SOURCE_DIR
          #
          # This makes BUILD_SOURCE_DIR available to later
          # GitHub Actions steps.
          # ======================================================

          "BUILD_SOURCE_DIR=$buildSourceDir" `
            | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""

          Write-Host "BUILD_SOURCE_DIR persisted as:"

          Write-Host $buildSourceDir


          # Explicit success
          exit 0


      # ==========================================================
      # STEP 6
      # VERIFY BUILD SOURCE
      # ==========================================================

      - name: Verify Build Source

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Verifying Build Source"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Deployment Scope:"
          Write-Host $env:DEPLOYMENT_SCOPE


          Write-Host ""
          Write-Host "BUILD_SOURCE_DIR:"
          Write-Host $env:BUILD_SOURCE_DIR


          # ======================================================
          # VERIFY ENVIRONMENT VARIABLE
          # ======================================================

          if ([string]::IsNullOrWhiteSpace($env:BUILD_SOURCE_DIR)) {

              Write-Error "BUILD_SOURCE_DIR is empty."

              exit 1
          }


          # ======================================================
          # VERIFY DIRECTORY
          # ======================================================

          if (-not (Test-Path $env:BUILD_SOURCE_DIR)) {

              Write-Error `
                "BUILD_SOURCE_DIR does not exist: $env:BUILD_SOURCE_DIR"

              exit 1
          }


          Write-Host ""
          Write-Host "BUILD_SOURCE_DIR exists."


          # ======================================================
          # SHOW PACKAGES
          # ======================================================

          Write-Host ""
          Write-Host "Packages that will be sent to ABE:"


          $buildPackages = Get-ChildItem `
            -Path $env:BUILD_SOURCE_DIR `
            -Directory


          if ($buildPackages.Count -eq 0) {

              Write-Error `
                "No IS packages found under BUILD_SOURCE_DIR."

              exit 1
          }


          foreach ($package in $buildPackages) {

              Write-Host "  - $($package.Name)"
          }


          Write-Host ""
          Write-Host "Build source verification completed."


      # ==========================================================
      # STEP 7
      # BUILD
      #
      # IMPORTANT:
      #
      # SOURCE_DIR is passed to the Ant wrapper.
      #
      # run/build.xml
      #       |
      #       v
      # SAG_CI_HOME/build.xml
      #       |
      #       v
      # buildCallABE.xml
      #       |
      #       v
      # ABE master_build
      #       |
      #       v
      # IS/build.xml
      #
      # abe-project.properties must contain:
      #
      # isPackages=${SOURCE_DIR}
      #
      # ==========================================================

      - name: Build

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Starting WebMethods Build"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Deployment Scope:"
          Write-Host $env:DEPLOYMENT_SCOPE


          Write-Host ""
          Write-Host "Build Source Directory:"
          Write-Host $env:BUILD_SOURCE_DIR


          Write-Host ""
          Write-Host "Build Number:"
          Write-Host $env:MAIN_BUILDNUMBER


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          # ======================================================
          # VALIDATE BUILD_SOURCE_DIR
          # ======================================================

          if ([string]::IsNullOrWhiteSpace($env:BUILD_SOURCE_DIR)) {

              Write-Error "BUILD_SOURCE_DIR is empty."

              exit 1
          }


          if (-not (Test-Path $env:BUILD_SOURCE_DIR)) {

              Write-Error `
                "BUILD_SOURCE_DIR does not exist: $env:BUILD_SOURCE_DIR"

              exit 1
          }


          Write-Host ""
          Write-Host "BUILD_SOURCE_DIR exists."


          # ======================================================
          # DISPLAY PACKAGES TO BE BUILT
          # ======================================================

          Write-Host ""
          Write-Host "Packages that will be sent to ABE:"


          Get-ChildItem `
            -Path $env:BUILD_SOURCE_DIR `
            -Directory `
            | ForEach-Object {

                Write-Host "  - $($_.Name)"
            }


          # ======================================================
          # INVOKE ANT BUILD
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Invoking Ant Build"
          Write-Host "=========================================="


          & "$env:ANT_HOME\bin\ant.bat" `
            "-DSAG_CI_HOME=$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
            "-DSOURCE_DIR=$env:BUILD_SOURCE_DIR" `
            "-DtargetEnv=$env:TARGET_ENVIRONMENT" `
            "-DbuildNumber=$env:MAIN_BUILDNUMBER" `
            "-DprojectName=$env:PROJECT_NAME" `
            -f "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml" `
            build


          $antExitCode = $LASTEXITCODE


          Write-Host ""
          Write-Host "Ant exit code: $antExitCode"


          # ======================================================
          # HANDLE ANT RESULT
          # ======================================================

          if ($antExitCode -ne 0) {

              Write-Error "WebMethods ABE build failed."

              exit $antExitCode
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WebMethods Build Completed Successfully"
          Write-Host "=========================================="


      # ==========================================================
      # STEP 8
      # CREATE DEPLOYMENT PROJECT
      # ==========================================================

      - name: Create Deployment Project

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Create Deployment Project"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""
          Write-Host "Target IS Group Alias:"
          Write-Host $env:TARGET_ISGROUP_ALIAS


          # ------------------------------------------------------
          # Existing Project Automator / Deployer project creation
          # logic should be placed here.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Deployment project preparation completed."


      # ==========================================================
      # STEP 9
      # VARIABLE SUBSTITUTION
      # ==========================================================

      - name: Variable Substitution

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Variable Substitution"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""
          Write-Host "Target IS Group Alias:"
          Write-Host $env:TARGET_ISGROUP_ALIAS


          # ------------------------------------------------------
          # Existing environment-specific variable substitution
          # logic should be placed here.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Variable substitution completed."


      # ==========================================================
      # STEP 10
      # DEPLOY
      # ==========================================================

      - name: Deploy

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Starting WebMethods Deployment"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Build Source Directory:"
          Write-Host $env:BUILD_SOURCE_DIR


          Write-Host ""
          Write-Host "Target IS Group Alias:"
          Write-Host $env:TARGET_ISGROUP_ALIAS


          # ======================================================
          # INVOKE ANT DEPLOY
          # ======================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Invoking Ant Deploy"
          Write-Host "=========================================="


          & "$env:ANT_HOME\bin\ant.bat" `
            "-DSAG_CI_HOME=$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
            "-DSOURCE_DIR=$env:BUILD_SOURCE_DIR" `
            "-DtargetEnv=$env:TARGET_ENVIRONMENT" `
            "-DisGroupAlias=$env:TARGET_ISGROUP_ALIAS" `
            "-DbuildNumber=$env:MAIN_BUILDNUMBER" `
            "-DprojectName=$env:PROJECT_NAME" `
            -f "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml" `
            deploy


          $antExitCode = $LASTEXITCODE


          Write-Host ""
          Write-Host "Ant deploy exit code: $antExitCode"


          if ($antExitCode -ne 0) {

              Write-Error "WebMethods deployment failed."

              exit $antExitCode
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WebMethods Deployment Completed"
          Write-Host "=========================================="


      # ==========================================================
      # STEP 11
      # ADAPTER CONFIGURATION
      # ==========================================================

      - name: Deploy Adapter Configuration

        if: ${{ inputs.hasAdapterPackage == true }}

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Deploy Adapter Configuration"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Adapter Configuration Package:"
          Write-Host $env:ADAPTER_CONFIGPKG


          # ------------------------------------------------------
          # Existing adapter configuration deployment logic.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Adapter configuration deployment completed."


      # ==========================================================
      # STEP 12
      # WEBMETHODS TEST SUITE
      # ==========================================================

      - name: Execute WM Test Suite

        if: ${{ inputs.executeWmTestSuite == true }}

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Execute WebMethods Test Suite"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Executing WM Test Suite..."


          # ------------------------------------------------------
          # Existing WM Test Suite execution logic.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "WM Test Suite execution completed."
