name: Thermofisher_Dev

on:
  workflow_dispatch:
    inputs:

      targetEnvironment:
        description: "Target Environment"
        required: true
        type: string

      deploymentScope:
        description: "Deployment Scope"
        required: true
        type: choice
        options:
          - ALL
          - SELECTIVE
        default: ALL

      packageName:
        description: "IS Package name(s) for SELECTIVE deployment - comma separated"
        required: false
        type: string
        default: ""

      targetISGroupAlias:
        description: "Target IS Group Alias"
        required: true
        type: string

      buildNumber:
        description: "Build Number"
        required: true
        type: string

      hasAdapterPackage:
        description: "Has Adapter Package"
        required: true
        type: boolean
        default: false

      adapterConfigPackage:
        description: "Adapter Configuration Package"
        required: false
        type: string
        default: ""

      RepoBranchName:
        description: "Repository Branch"
        required: true
        type: string
        default: "main"

      executeWmTestSuite:
        description: "Execute WM Test Suite"
        required: true
        type: boolean
        default: false


jobs:

  webmethods-cicd:

    runs-on:
      - self-hosted
      - windows
      - webmethods

    env:

      # ==========================================================
      # WebMethods / CI-CD Paths
      # ==========================================================

      CICD_HOME: "C:/devops/sagdevops-cicd"

      SAG_BUILD_HOME: "C:/SoftwareAG11_ABE"

      SAG_HOME: "C:/SoftwareAG11"

      ANT_HOME: "C:/SoftwareAG11_ABE/common/lib/ant"

      JAVA_HOME: "C:/SoftwareAG11/jvm/jvm/bin"

      CHECKOUT_DIR: "C:/SoftwareAG/tools/Checkout"

      SELECTIVE_SOURCE_DIR: "C:/SoftwareAG/tools/CheckoutSelective"


      # ==========================================================
      # Workflow Inputs
      # ==========================================================

      TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

      DEPLOYMENT_SCOPE: ${{ inputs.deploymentScope }}

      ISPACKAGES_LIST: ${{ inputs.packageName }}

      TARGET_ISGROUP_ALIAS: ${{ inputs.targetISGroupAlias }}

      MAIN_BUILDNUMBER: ${{ inputs.buildNumber }}

      HAS_ADAPTERPKG: ${{ inputs.hasAdapterPackage }}

      ADAPTER_CONFIGPKG: ${{ inputs.adapterConfigPackage }}

      REPO_BRANCH_NAME: ${{ inputs.RepoBranchName }}

      EXECUTE_WMTEST: ${{ inputs.executeWmTestSuite }}


    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================

      - name: Checkout GitHub Repository

        uses: actions/checkout@v4

        with:

          ref: ${{ inputs.RepoBranchName }}

          clean: true


      # ==========================================================
      # 2. Prepare WebMethods Checkout Directory
      # ==========================================================

      - name: Prepare WebMethods Checkout Directory

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Preparing WebMethods Checkout Directory"
          Write-Host "=========================================="

          Write-Host "GitHub Workspace : $env:GITHUB_WORKSPACE"
          Write-Host "Checkout Dir     : $env:CHECKOUT_DIR"

          # ------------------------------------------------------
          # Create / clean fixed WebMethods checkout directory
          # ------------------------------------------------------

          if (Test-Path $env:CHECKOUT_DIR) {

              Write-Host "Cleaning existing checkout directory..."

              Remove-Item `
                -Path "$env:CHECKOUT_DIR\*" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          else {

              Write-Host "Creating checkout directory..."

              New-Item `
                -ItemType Directory `
                -Path $env:CHECKOUT_DIR `
                -Force | Out-Null
          }


          # ------------------------------------------------------
          # Copy GitHub workspace to WebMethods checkout directory
          # ------------------------------------------------------

          Write-Host "Copying GitHub repository to CHECKOUT_DIR..."

          robocopy `
            "$env:GITHUB_WORKSPACE" `
            "$env:CHECKOUT_DIR" `
            /MIR `
            /XD ".git"

          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $robocopyExitCode"


          # ------------------------------------------------------
          # Robocopy exit codes
          #
          # 0-7  = Successful / acceptable
          # 8+   = Failure
          # ------------------------------------------------------

          if ($robocopyExitCode -ge 8) {

              Write-Error "Failed to copy GitHub workspace to CHECKOUT_DIR."

              exit $robocopyExitCode
          }


          Write-Host "Repository successfully copied."


          # ------------------------------------------------------
          # Display checkout directory
          # ------------------------------------------------------

          Write-Host "Checkout directory contents:"

          Get-ChildItem `
            -Path $env:CHECKOUT_DIR `
            -Force


          # ------------------------------------------------------
          # IMPORTANT
          #
          # Robocopy returns:
          # 0 = Nothing copied
          # 1 = Files copied successfully
          #
          # GitHub Actions treats the final PowerShell exit code
          # as the step result.
          #
          # Therefore explicitly return 0.
          # ------------------------------------------------------

          exit 0


      # ==========================================================
      # 3. Display Environment Variables
      # ==========================================================

      - name: Set Environment Variables

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "CI/CD Environment Variables"
          Write-Host "=========================================="

          Write-Host "TARGET_ENVIRONMENT : $env:TARGET_ENVIRONMENT"

          Write-Host "DEPLOYMENT_SCOPE   : $env:DEPLOYMENT_SCOPE"

          Write-Host "ISPACKAGES_LIST    : $env:ISPACKAGES_LIST"

          Write-Host "TARGET_ISGROUP_ALIAS : $env:TARGET_ISGROUP_ALIAS"

          Write-Host "MAIN_BUILDNUMBER   : $env:MAIN_BUILDNUMBER"

          Write-Host "HAS_ADAPTERPKG     : $env:HAS_ADAPTERPKG"

          Write-Host "ADAPTER_CONFIGPKG  : $env:ADAPTER_CONFIGPKG"

          Write-Host "REPO_BRANCH_NAME   : $env:REPO_BRANCH_NAME"

          Write-Host "EXECUTE_WMTEST     : $env:EXECUTE_WMTEST"

          Write-Host "CHECKOUT_DIR       : $env:CHECKOUT_DIR"

          Write-Host "SELECTIVE_SOURCE_DIR : $env:SELECTIVE_SOURCE_DIR"


      # ==========================================================
      # 4. Verify Build Environment
      # ==========================================================

      - name: Verify Build Environment

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Verifying Build Environment"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "Java Version"
          Write-Host "------------"

          & "$env:JAVA_HOME\java.exe" -version


          Write-Host ""
          Write-Host "Git Version"
          Write-Host "-----------"

          git --version


          Write-Host ""
          Write-Host "Ant Version"
          Write-Host "-----------"

          & "$env:ANT_HOME\bin\ant.bat" -version


          Write-Host ""
          Write-Host "Checking required directories"
          Write-Host "-----------------------------"

          $requiredPaths = @(

              "$env:JAVA_HOME",

              "$env:SAG_HOME",

              "$env:SAG_BUILD_HOME",

              "$env:ANT_HOME",

              "$env:CICD_HOME",

              "$env:CHECKOUT_DIR",

              "$env:CHECKOUT_DIR\is",

              "$env:CHECKOUT_DIR\is\packages"

          )


          foreach ($path in $requiredPaths) {

              Write-Host "Checking: [$path]"

              if (-not (Test-Path $path)) {

                  Write-Error "Required path does not exist: $path"

                  exit 1
              }

              else {

                  Write-Host "OK: $path"
              }
          }


      # ==========================================================
      # 5. Prepare Build Source
      #
      # ALL:
      #   Build source =
      #   C:/SoftwareAG/tools/Checkout/is/packages
      #
      # SELECTIVE:
      #   Selected packages are copied to:
      #   C:/SoftwareAG/tools/CheckoutSelective
      #
      #   Build source =
      #   C:/SoftwareAG/tools/CheckoutSelective
      # ==========================================================

      - name: Prepare Build Source

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Preparing Build Source"
          Write-Host "=========================================="


          $sourcePackages = Join-Path `
            $env:CHECKOUT_DIR `
            "is\packages"


          $selectiveDir = $env:SELECTIVE_SOURCE_DIR


          Write-Host "Deployment Scope : $env:DEPLOYMENT_SCOPE"

          Write-Host "Source Packages  : $sourcePackages"

          Write-Host "Selective Dir    : $selectiveDir"


          # ======================================================
          # ALL PACKAGE DEPLOYMENT
          # ======================================================

          if ($env:DEPLOYMENT_SCOPE -eq "ALL") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "ALL PACKAGE DEPLOYMENT"
              Write-Host "=========================================="

              if (-not (Test-Path $sourcePackages)) {

                  Write-Error "IS packages directory does not exist: $sourcePackages"

                  exit 1
              }


              $buildSourceDir = $sourcePackages


              Write-Host ""
              Write-Host "Build Source Directory:"
              Write-Host $buildSourceDir
          }


          # ======================================================
          # SELECTIVE PACKAGE DEPLOYMENT
          # ======================================================

          elseif ($env:DEPLOYMENT_SCOPE -eq "SELECTIVE") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "SELECTIVE PACKAGE DEPLOYMENT"
              Write-Host "=========================================="


              # --------------------------------------------------
              # Validate package input
              # --------------------------------------------------

              if ([string]::IsNullOrWhiteSpace($env:ISPACKAGES_LIST)) {

                  Write-Error `
                    "packageName is required when deploymentScope is SELECTIVE."

                  exit 1
              }


              # --------------------------------------------------
              # Clean selective source directory
              # --------------------------------------------------

              if (Test-Path $selectiveDir) {

                  Write-Host "Cleaning selective source directory..."

                  Remove-Item `
                    -Path "$selectiveDir\*" `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue
              }

              else {

                  Write-Host "Creating selective source directory..."

                  New-Item `
                    -ItemType Directory `
                    -Path $selectiveDir `
                    -Force | Out-Null
              }


              # --------------------------------------------------
              # Split comma-separated package list
              # --------------------------------------------------

              $packages = $env:ISPACKAGES_LIST `
                -split "," `
                | ForEach-Object {
                    $_.Trim()
                  } `
                | Where-Object {
                    -not [string]::IsNullOrWhiteSpace($_)
                  } `
                | Select-Object -Unique


              Write-Host ""
              Write-Host "Packages requested:"
              $packages | ForEach-Object {
                  Write-Host "  - $_"
              }


              # --------------------------------------------------
              # Validate and copy each package
              # --------------------------------------------------

              foreach ($package in $packages) {

                  Write-Host ""
                  Write-Host "------------------------------------------"

                  Write-Host "Processing package: $package"

                  Write-Host "------------------------------------------"


                  # ------------------------------------------------
                  # Prevent path traversal / invalid package paths
                  # ------------------------------------------------

                  if (
                      $package.Contains("..") -or
                      $package.Contains("/") -or
                      $package.Contains("\") -or
                      $package.Contains(":")
                  ) {

                      Write-Error `
                        "Invalid package name: $package"

                      exit 1
                  }


                  $sourcePackage = Join-Path `
                    $sourcePackages `
                    $package


                  $targetPackage = Join-Path `
                    $selectiveDir `
                    $package


                  # ------------------------------------------------
                  # Verify source package exists
                  # ------------------------------------------------

                  if (-not (Test-Path $sourcePackage)) {

                      Write-Error `
                        "Package [$package] does not exist under [$sourcePackages]"

                      exit 1
                  }


                  Write-Host "Source : $sourcePackage"

                  Write-Host "Target : $targetPackage"


                  # ------------------------------------------------
                  # Create target package directory
                  # ------------------------------------------------

                  New-Item `
                    -ItemType Directory `
                    -Path $targetPackage `
                    -Force | Out-Null


                  # ------------------------------------------------
                  # Copy package
                  # ------------------------------------------------

                  robocopy `
                    "$sourcePackage" `
                    "$targetPackage" `
                    /E

                  $robocopyExitCode = $LASTEXITCODE


                  Write-Host `
                    "Robocopy exit code for [$package]: $robocopyExitCode"


                  if ($robocopyExitCode -ge 8) {

                      Write-Error `
                        "Failed to copy package [$package]."

                      exit $robocopyExitCode
                  }


                  Write-Host `
                    "Package [$package] copied successfully."
              }


              $buildSourceDir = $selectiveDir


              Write-Host ""
              Write-Host "=========================================="

              Write-Host "SELECTIVE BUILD SOURCE CREATED"

              Write-Host "=========================================="

              Write-Host "Build Source Directory:"
              Write-Host $buildSourceDir


              Write-Host ""
              Write-Host "Selective source contents:"

              Get-ChildItem `
                -Path $buildSourceDir `
                -Force `
                -Recurse
          }


          # ======================================================
          # Invalid deployment scope
          # ======================================================

          else {

              Write-Error `
                "Invalid deployment scope: $env:DEPLOYMENT_SCOPE"

              exit 1
          }


          # ======================================================
          # Persist BUILD_SOURCE_DIR for subsequent steps
          # ======================================================

          "BUILD_SOURCE_DIR=$buildSourceDir" `
            | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""

          Write-Host "BUILD_SOURCE_DIR persisted as:"
          Write-Host $buildSourceDir


      # ==========================================================
      # 6. Verify Build Source
      # ==========================================================

      - name: Verify Build Source

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Verifying Build Source"
          Write-Host "=========================================="


          Write-Host "Deployment Scope : $env:DEPLOYMENT_SCOPE"

          Write-Host "Build Source Dir : $env:BUILD_SOURCE_DIR"


          if (-not (Test-Path $env:BUILD_SOURCE_DIR)) {

              Write-Error `
                "BUILD_SOURCE_DIR does not exist: $env:BUILD_SOURCE_DIR"

              exit 1
          }


          Write-Host ""
          Write-Host "Build source contents:"
          Write-Host ""


          Get-ChildItem `
            -Path $env:BUILD_SOURCE_DIR `
            -Force


          Write-Host ""

          Write-Host "Packages available for build:"


          Get-ChildItem `
            -Path $env:BUILD_SOURCE_DIR `
            -Directory `
            | ForEach-Object {

                Write-Host "  - $($_.Name)"
            }


      # ==========================================================
      # 7. Build
      #
      # SOURCE_DIR is passed to the Ant wrapper.
      #
      # build.xml -> SAG_CI_HOME/build.xml
      #            -> buildCallABE.xml
      #            -> ABE master_build
      #            -> IS/build.xml
      #
      # abe-project.properties resolves:
      #
      # isPackages=${SOURCE_DIR}
      # ==========================================================

      - name: Build

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Starting WebMethods Build"
          Write-Host "=========================================="


          Write-Host "Build Source Directory:"
          Write-Host $env:BUILD_SOURCE_DIR


          Write-Host ""

          Write-Host "Build Number:"
          Write-Host $env:MAIN_BUILDNUMBER


          Write-Host ""

          Write-Host "Target Environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""

          Write-Host "Invoking Ant build..."


          & "$env:ANT_HOME\bin\ant.bat" `
            -DSAG_CI_HOME="$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
            -DSOURCE_DIR="$env:BUILD_SOURCE_DIR" `
            -DprojectName="$env:GITHUB_REPOSITORY" `
            -DbuildNumber="$env:MAIN_BUILDNUMBER" `
            -DtargetEnv="$env:TARGET_ENVIRONMENT" `
            -f "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml" `
            build


          if ($LASTEXITCODE -ne 0) {

              Write-Error "WebMethods build failed."

              exit $LASTEXITCODE
          }


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "WebMethods Build Completed Successfully"

          Write-Host "=========================================="


      # ==========================================================
      # 8. Create Deployment Project
      # ==========================================================

      - name: Create Deployment Project

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Create Deployment Project"
          Write-Host "=========================================="


          Write-Host "This step will create / prepare the"
          Write-Host "Deployer project definition."


          # ------------------------------------------------------
          # Existing Project Automator / Deployer logic goes here
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Deployment project preparation completed."


      # ==========================================================
      # 9. Variable Substitution
      # ==========================================================

      - name: Variable Substitution

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Variable Substitution"
          Write-Host "=========================================="


          Write-Host "Target Environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host "Target IS Group Alias:"
          Write-Host $env:TARGET_ISGROUP_ALIAS


          # ------------------------------------------------------
          # Existing environment-specific variable substitution
          # logic goes here.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Variable substitution step completed."


      # ==========================================================
      # 10. Deploy
      # ==========================================================

      - name: Deploy

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Starting WebMethods Deployment"
          Write-Host "=========================================="


          Write-Host "Build Source Directory:"
          Write-Host $env:BUILD_SOURCE_DIR


          Write-Host "Target IS Group Alias:"
          Write-Host $env:TARGET_ISGROUP_ALIAS


          Write-Host ""

          Write-Host "Invoking Ant deploy..."


          & "$env:ANT_HOME\bin\ant.bat" `
            -DSAG_CI_HOME="$env:CICD_HOME/cicd/scripts/build-and-deploy/setup" `
            -DSOURCE_DIR="$env:BUILD_SOURCE_DIR" `
            -DtargetEnv="$env:TARGET_ENVIRONMENT" `
            -DisGroupAlias="$env:TARGET_ISGROUP_ALIAS" `
            -DprojectName="$env:GITHUB_REPOSITORY" `
            -DbuildNumber="$env:MAIN_BUILDNUMBER" `
            -f "$env:CICD_HOME/cicd/scripts/build-and-deploy/run/build.xml" `
            deploy


          if ($LASTEXITCODE -ne 0) {

              Write-Error "WebMethods deployment failed."

              exit $LASTEXITCODE
          }


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "WebMethods Deployment Completed"

          Write-Host "=========================================="


      # ==========================================================
      # 11. Deploy Adapter Configuration
      # ==========================================================

      - name: Deploy Adapter Configuration

        if: ${{ inputs.hasAdapterPackage == true }}

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Deploy Adapter Configuration"
          Write-Host "=========================================="


          Write-Host "Adapter Configuration Package:"
          Write-Host $env:ADAPTER_CONFIGPKG


          # ------------------------------------------------------
          # Existing adapter configuration deployment logic
          # goes here.
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Adapter configuration deployment completed."


      # ==========================================================
      # 12. Execute WM Test Suite
      # ==========================================================

      - name: Execute WM Test Suite

        if: ${{ inputs.executeWmTestSuite == true }}

        shell: powershell

        run: |

          Write-Host "=========================================="
          Write-Host "Execute WebMethods Test Suite"
          Write-Host "=========================================="


          Write-Host "Executing WM Test Suite..."


          # ------------------------------------------------------
          # Existing WM Test Suite execution logic goes here.
          # ------------------------------------------------------

          Write-Host ""

          Write-Host "WM Test Suite execution completed."
