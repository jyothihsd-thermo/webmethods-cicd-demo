name: WebMethods Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:

  test-runner:

    runs-on: [self-hosted, windows, webmethods]

    env:

      CICD_HOME: 'C:\devops\sagdevops-cicd'

      ABE_HOME: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment'
      ABE_BUILD: 'C:\SoftwareAG11_ABE\common\AssetBuildEnvironment\bin\build.bat'

      JAVA_HOME: 'C:\SoftwareAG11\jvm\jvm'

      CHECKOUT_DIR: 'C:\SoftwareAG\tools\Checkout'

      ISCCR_HOME: 'C:\SoftwareAG\tools\CodeReview\ISCCR'
      ISCCR_CMD: 'C:\SoftwareAG\tools\CodeReview\ISCCR\CodeReview.cmd'

      DEPLOYER_HOME: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin'

      PROJECT_AUTOMATOR: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\projectAutomator.bat'

      PROJECT_AUTOMATOR_XML: 'C:\SoftwareAG\tools\Deploy\ProjectAutomator.xml'

      DEPLOYER_CMD: 'C:\SoftwareAG11_ABE\IntegrationServer\instances\default\packages\WmDeployer\bin\Deployer.bat'

      DEPLOYER_HOST: 'localhost'
      DEPLOYER_PORT: '5558'
      DEPLOYER_USER: 'Administrator'


    steps:

      # ---------------------------------------------------------
      # 1. Runner
      # ---------------------------------------------------------

      - name: Runner Information
        shell: powershell
        run: |

          Write-Host "===================================="
          Write-Host "GitHub Self Hosted Runner"
          Write-Host "===================================="

          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "User     : $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"


      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------

      - name: Check Java
        shell: powershell
        run: |

          Write-Host "JAVA_HOME = $env:JAVA_HOME"

          if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {

              Write-Error "Java not found:"
              Write-Error "$env:JAVA_HOME\bin\java.exe"

              exit 1
          }

          & "$env:JAVA_HOME\bin\java.exe" -version


      # ---------------------------------------------------------
      # 3. ABE
      # ---------------------------------------------------------

      - name: Check ABE
        shell: powershell
        run: |

          Write-Host "ABE_HOME  = $env:ABE_HOME"
          Write-Host "ABE_BUILD = $env:ABE_BUILD"

          if (-not (Test-Path $env:ABE_HOME)) {

              Write-Error "ABE_HOME not found:"
              Write-Error $env:ABE_HOME

              exit 1
          }

          if (-not (Test-Path $env:ABE_BUILD)) {

              Write-Error "ABE build.bat not found:"
              Write-Error $env:ABE_BUILD

              exit 1
          }

          Write-Host "ABE installation found successfully."


      # ---------------------------------------------------------
      # 4. Checkout directory
      # ---------------------------------------------------------

      - name: Check Checkout Directory
        shell: powershell
        run: |

          Write-Host "CHECKOUT_DIR = $env:CHECKOUT_DIR"

          if (-not (Test-Path $env:CHECKOUT_DIR)) {

              Write-Host "Checkout directory does not exist."
              Write-Host "Creating it..."

              New-Item `
                -ItemType Directory `
                -Path $env:CHECKOUT_DIR `
                -Force | Out-Null
          }

          Write-Host "Checkout directory is available."


      # ---------------------------------------------------------
      # 5. ISCCR
      # ---------------------------------------------------------

      - name: Check ISCCR
        shell: powershell
        run: |

          Write-Host "ISCCR_HOME = $env:ISCCR_HOME"
          Write-Host "ISCCR_CMD  = $env:ISCCR_CMD"

          if (-not (Test-Path $env:ISCCR_CMD)) {

              Write-Error "ISCCR CodeReview.cmd not found:"
              Write-Error $env:ISCCR_CMD

              exit 1
          }

          Write-Host "ISCCR installation found successfully."


      # ---------------------------------------------------------
      # 6. Project Automator
      # ---------------------------------------------------------

      - name: Check Project Automator
        shell: powershell
        run: |

          Write-Host "PROJECT_AUTOMATOR = $env:PROJECT_AUTOMATOR"

          if (-not (Test-Path $env:PROJECT_AUTOMATOR)) {

              Write-Error "ProjectAutomator.bat not found:"
              Write-Error $env:PROJECT_AUTOMATOR

              exit 1
          }

          if (-not (Test-Path $env:PROJECT_AUTOMATOR_XML)) {

              Write-Error "ProjectAutomator.xml not found:"
              Write-Error $env:PROJECT_AUTOMATOR_XML

              exit 1
          }

          Write-Host "Project Automator installation found."


      # ---------------------------------------------------------
      # 7. Deployer
      # ---------------------------------------------------------

      - name: Check Deployer
        shell: powershell
        run: |

          Write-Host "DEPLOYER_CMD = $env:DEPLOYER_CMD"

          if (-not (Test-Path $env:DEPLOYER_CMD)) {

              Write-Error "Deployer.bat not found:"
              Write-Error $env:DEPLOYER_CMD

              exit 1
          }

          Write-Host "Deployer installation found."


      # ---------------------------------------------------------
      # 8. Summary
      # ---------------------------------------------------------

      - name: Environment Summary
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "===================================="
          Write-Host "WebMethods Environment"
          Write-Host "===================================="

          Write-Host "JAVA_HOME          = $env:JAVA_HOME"
          Write-Host "ABE_HOME           = $env:ABE_HOME"
          Write-Host "CHECKOUT_DIR       = $env:CHECKOUT_DIR"
          Write-Host "ISCCR_CMD          = $env:ISCCR_CMD"
          Write-Host "PROJECT_AUTOMATOR  = $env:PROJECT_AUTOMATOR"
          Write-Host "PROJECT_AUTOMATOR_XML = $env:PROJECT_AUTOMATOR_XML"
          Write-Host "DEPLOYER_CMD       = $env:DEPLOYER_CMD"
          Write-Host "DEPLOYER           = $env:DEPLOYER_HOST`:$env:DEPLOYER_PORT"

          Write-Host ""
          Write-Host "Environment validation completed."
